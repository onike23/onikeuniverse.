<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnikeUniverse 🪐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:radial-gradient(120% at 0% 0%,#1a1040,#0a0a18 60%,#0e1a2a);color:#fff;min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);background:rgba(10,10,24,0.8);border-bottom:1px solid #2a2a5a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:18px}
.bar{height:2px;background:linear-gradient(90deg,#a78bfa,#22d3ee,#f59e0b)}
.card{background:rgba(17,17,42,0.85);backdrop-filter:blur(16px);border:1px solid #2a2a5a;border-radius:20px;padding:14px;margin:10px 16px}
.btn{background:linear-gradient(135deg,#a78bfa,#22d3ee);border:none;padding:8px 16px;border-radius:20px;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,0.06);border:1px solid #2a2a5a;color:#aaa}
.nav{position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-around;background:rgba(10,10,24,0.9);backdrop-filter:blur(20px);border:1px solid #2a2a5a;border-radius:22px;padding:8px 0;z-index:100}
.nav div{font-size:10px;text-align:center;color:#8b8bb0;cursor:pointer;padding:6px 10px;border-radius:12px}
.nav div.active{color:#fff;background:rgba(167,139,250,0.2)}
.page{display:none}.page.show{display:block}
input{background:rgba(255,255,255,0.06);border:1px solid #2a2a5a;border-radius:12px;padding:12px;color:#fff;width:100%;outline:none}
.badge{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:50%;font-size:8px;margin-left:6px;border:1px solid #fbbf24;position:relative;vertical-align:middle}
.badge:hover::after{content:'OnikeUniverse Official 🪐';position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#0a0a18;border:1px solid #fbbf24;color:#fbbf24;font-size:9px;padding:4px 8px;border-radius:8px;white-space:nowrap;z-index:999}
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 16px}
.story{text-align:center;min-width:60px}
.ring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#a78bfa,#22d3ee)}
.ring-inner{width:100%;height:100%;background:#0a0a18;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid #0a0a18}
</style>
</head>
<body>
<div class="bar"></div>
<div class="top">
  <b class="logo">🪐 OnikeUniverse</b>
  <div style="display:flex;gap:14px;font-size:18px">
    <span onclick="go('messages')" style="cursor:pointer">📩</span>
    <span onclick="go('notif')" style="cursor:pointer">🔔</span>
    <span onclick="go('menu')" style="cursor:pointer">☰</span>
  </div>
</div>

<!-- HOME -->
<div id="page-blog" class="page show">
  <div class="stories" id="storiesBar"></div>
  <div class="card"><input id="postInput" placeholder="What's happening?"><button class="btn" style="width:100%;margin-top:10px" onclick="createPost()">Post 🪐</button></div>
  <div id="feed"></div>
</div>

<!-- FRIENDS / SEARCH -->
<div id="page-search" class="page">
  <div class="card"><input id="searchInput" placeholder="Search users..." oninput="searchUsers(this.value)"><p style="font-size:11px;color:#8b8bb0;margin-top:8px">Friends • Search</p></div>
  <div id="searchList"></div>
</div>

<!-- MESSAGES -->
<div id="page-messages" class="page">
  <div class="card"><b>📩 Messages</b><p style="font-size:12px;color:#8b8bb0;margin-top:6px">Your conversations</p></div>
  <div id="msgList"></div>
</div>

<!-- NOTIFICATIONS -->
<div id="page-notif" class="page">
  <div class="card"><b>🔔 Notifications</b></div>
  <div id="notifList"></div>
</div>

<!-- PROFILE -->
<div id="page-profile" class="page">
  <div class="card" style="text-align:center">
    <img id="pAvatar" src="https://i.pravatar.cc/150?img=68" style="width:84px;height:84px;border-radius:50%;border:3px solid #a78bfa">
    <h2 id="pName" style="margin-top:8px;display:flex;justify-content:center;align-items:center"></h2>
    <div style="display:flex;justify-content:space-around;margin-top:12px">
      <div><b id="sPosts">0</b><br><span style="font-size:11px;color:#8b8bb0">Posts</span></div>
      <div><b id="sFollowers">0</b><br><span style="font-size:11px;color:#8b8bb0">Followers</span></div>
      <div><b id="sFollowing">0</b><br><span style="font-size:11px;color:#8b8bb0">Following</span></div>
    </div>
  </div>
  <div id="myFeed"></div>
</div>

<!-- MENU - NOW YOU CAN SEE IT -->
<div id="page-menu" class="page">
  <div class="card" style="text-align:center">
    <img id="mAvatar" src="https://i.pravatar.cc/150?img=68" style="width:84px;height:84px;border-radius:50%;border:3px solid #a78bfa">
    <h3 id="mName" style="margin-top:8px;display:flex;justify-content:center;align-items:center"></h3>
    <div id="mStatus" style="margin-top:8px"></div>
  </div>
  <div class="card" onclick="go('profile')" style="cursor:pointer">👤 My Profile <span style="float:right">›</span></div>
  <div class="card" onclick="go('search')" style="cursor:pointer">🔍 Friends / Search <span style="float:right">›</span></div>
  <div class="card" onclick="go('messages')" style="cursor:pointer">📩 Messages <span style="float:right">›</span></div>
  <div class="card" onclick="go('notif')" style="cursor:pointer">🔔 Notifications <span style="float:right">›</span></div>
  <div class="card" onclick="doVerify()" style="cursor:pointer;display:flex;justify-content:space-between"><span>🪐 Verify Official</span><span id="vBtn" class="btn-ghost" style="padding:4px 12px;border-radius:10px;font-size:11px">Locked</span></div>
  <div class="card" onclick="alert('Settings soon')" style="cursor:pointer">⚙️ Settings <span style="float:right">›</span></div>
  <div class="card" onclick="alert('Privacy soon')" style="cursor:pointer">🔒 Privacy <span style="float:right">›</span></div>
  <div class="card" onclick="logout()" style="cursor:pointer;background:rgba(90,20,20,0.3)">🚪 Logout <span style="float:right">›</span></div>
</div>

<!-- BOTTOM NAV - ALL 5 VISIBLE -->
<div class="nav">
  <div id="n-home" class="active" onclick="go('blog')">🏠<br>Home</div>
  <div id="n-search" onclick="go('search')">🔍<br>Friends</div>
  <div onclick="go('messages')">📩<br>Messages</div>
  <div onclick="go('notif')">🔔<br>Notif</div>
  <div onclick="go('profile')">👤<br>Profile</div>
</div>

<script>
let USER={name:'Supreme',avatar:'https://i.pravatar.cc/150?img=68'};
let POSTS=JSON.parse(localStorage.getItem('ou6_posts')||'[{"id":1,"user":"Supreme","avatar":"https://i.pravatar.cc/150?img=68","text":"Welcome to OnikeUniverse 🪐","img":"https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=600","likes":24,"time":Date.now()}]');
let FOLLOWED=new Set(JSON.parse(localStorage.getItem('ou6_followed')||'[]'));
let IS_VERIFIED=localStorage.getItem('ou6_verified')==='true';
let FOLLOWERS=parseInt(localStorage.getItem('ou6_followers')||'12');
let USERS=['Supreme','Luna','Kai','Nova','Orion','Zara','GalaxyKid'];
let MSGS=[{from:'Luna',text:'Love your aurora post! 🌌',time:'2m'},{from:'Kai',text:'When are we collabing?',time:'1h'}];
let NOTIFS=[{text:'Luna liked your post 🪐',time:'5m'},{text:'Kai started following you',time:'1h'},{text:'Nova mentioned you',time:'3h'}];

function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.getElementById('page-'+id).classList.add('show');
  document.querySelectorAll('.nav div').forEach(d=>d.classList.remove('active'));
  if(id==='blog')document.getElementById('n-home').classList.add('active');
  if(id==='search')document.getElementById('n-search').classList.add('active');
  if(id==='blog')renderFeed();
  if(id==='profile')renderProfile();
  if(id==='search')renderSearch(USERS);
  if(id==='messages')renderMsgs();
  if(id==='notif')renderNotifs();
  updateUI();
}
function getStats(){return {posts:POSTS.filter(p=>p.user===USER.name).length,following:FOLLOWED.size,followers:FOLLOWERS};}
function updateUI(){
  let s=getStats();
  document.getElementById('sPosts').innerText=s.posts;document.getElementById('sFollowers').innerText=s.followers;document.getElementById('sFollowing').innerText=s.following;
  document.getElementById('pAvatar').src=USER.avatar;document.getElementById('mAvatar').src=USER.avatar;
  let badge=IS_VERIFIED?'<span class="badge" title="OnikeUniverse Official">🪐</span>':'';
  document.getElementById('pName').innerHTML=USER.name+badge;document.getElementById('mName').innerHTML=USER.name+badge;
  let mStatus=document.getElementById('mStatus'),vBtn=document.getElementById('vBtn');
  if(IS_VERIFIED){mStatus.innerHTML='<span style="color:#fbbf24;font-size:12px">🪐 OnikeUniverse Official</span>';vBtn.innerText='🪐 Verified';}
  else{mStatus.innerHTML=`<span style="font-size:11px;color:#aaa">${s.posts}/20 • ${s.followers}/100 • ${s.following}/10<br>${s.posts>=20&&s.followers>=100&&s.following>=10?'✅ Eligible!':'Need more'}</span>`;vBtn.innerText=(s.posts>=20&&s.followers>=100&&s.following>=10)?'Verify Now':'Locked';}
  document.getElementById('storiesBar').innerHTML='<div class="story"><div class="ring"><div class="ring-inner" style="background:#1a1a32">+</div></div><span>You</span></div>'+USERS.slice(1,6).map(n=>`<div class="story"><div class="ring"><div class="ring-inner"><img src="https://i.pravatar.cc/100?u=${n}" style="width:100%;height:100%"></div></div><span>${n}</span></div>`).join('');
}
function card(p){
  let badge=(p.user===USER.name&&IS_VERIFIED)?'<span class="badge">🪐</span>':'';
  return `<div class="card"><div style="display:flex;gap:10px;align-items:center"><img src="${p.avatar}" style="width:40px;height:40px;border-radius:50%"><b>${p.user}${badge}</b><span style="font-size:11px;color:#8b8bb0;margin-left:auto">${Math.floor((Date.now()-p.time)/60000)}m</span></div><p style="margin:10px 0">${p.text}</p>${p.img?`<img src="${p.img}" style="width:100%;border-radius:16px">`:''}<div style="margin-top:10px;display:flex;gap:16px;color:#aaa;font-size:13px"><span onclick="likePost(${p.id})" style="cursor:pointer">💜 ${p.likes}</span><span>💬</span></div></div>`;
}
function renderFeed(){document.getElementById('feed').innerHTML=POSTS.slice().reverse().map(p=>card(p)).join('');}
function renderProfile(){document.getElementById('myFeed').innerHTML=POSTS.filter(p=>p.user===USER.name).slice().reverse().map(p=>card(p)).join('');}
function renderSearch(list){document.getElementById('searchList').innerHTML=list.map(n=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:10px;align-items:center"><img src="https://i.pravatar.cc/100?u=${n}" style="width:36px;height:36px;border-radius:50%"><b>${n}</b></div><button class="${FOLLOWED.has(n)?'btn':'btn btn-ghost'}" onclick="toggleFollow('${n}',this)">${FOLLOWED.has(n)?'Following':'+ Follow'}</button></div>`).join('');}
function renderMsgs(){document.getElementById('msgList').innerHTML=MSGS.map(m=>`<div class="card" style="display:flex;gap:10px"><img src="https://i.pravatar.cc/100?u=${m.from}" style="width:40px;height:40px;border-radius:50%"><div><b>${m.from}</b><p style="font-size:13px;color:#aaa">${m.text}</p></div><span style="margin-left:auto;font-size:10px;color:#666">${m.time}</span></div>`).join('');}
function renderNotifs(){document.getElementById('notifList').innerHTML=NOTIFS.map(n=>`<div class="card"><p style="font-size:13px">${n.text}</p><span style="font-size:10px;color:#666">${n.time} ago</span></div>`).join('');}
function searchUsers(q){renderSearch(USERS.filter(u=>u.toLowerCase().includes(q.toLowerCase())));}
function createPost(){let i=document.getElementById('postInput');if(!i.value.trim())return;POSTS.push({id:Date.now(),user:USER.name,avatar:USER.avatar,text:i.value,likes:0,time:Date.now()});localStorage.setItem('ou6_posts',JSON.stringify(POSTS));i.value='';renderFeed();updateUI();}
function toggleFollow(name,btn){if(FOLLOWED.has(name)){FOLLOWED.delete(name);btn.innerText='+ Follow';btn.className='btn btn-ghost';}else{FOLLOWED.add(name);btn.innerText='Following';btn.className='btn';FOLLOWERS++;localStorage.setItem('ou6_followers',FOLLOWERS);}localStorage.setItem('ou6_followed',JSON.stringify([...FOLLOWED]));updateUI();}
function likePost(id){POSTS.find(p=>p.id===id).likes++;localStorage.setItem('ou6_posts',JSON.stringify(POSTS));renderFeed();}
function doVerify(){let s=getStats();if(IS_VERIFIED){alert('Already Official 🪐');return;}if(s.posts<20||s.followers<100||s.following<10){alert(`Need: 20 posts (${s.posts}), 100 followers (${s.followers}), 10 following (${s.following})`);return;}IS_VERIFIED=true;localStorage.setItem('ou6_verified','true');updateUI();renderFeed();alert('Verified 🪐');}
function logout(){localStorage.clear();location.reload();}
updateUI();renderFeed();
</script>
</body>
  </html>
