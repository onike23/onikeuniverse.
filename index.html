<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONIKEUNIVERSE - Fixed</title>
<style>
*{box-sizing:border-box;} body{margin:0; background:#111b21; color:#e9edef; font-family:sans-serif;}
#authPage{position:fixed; inset:0; background:#111b21; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.authBox{background:#202c33; width:100%; max-width:360px; border-radius:16px; padding:20px;}
.authTabs{display:flex; gap:10px; margin-bottom:16px;}.authTabs button{flex:1; padding:10px; border-radius:20px; border:none; font-weight:700;}
.authTabs button.active{background:#00a884; color:white;}.authTabs button.inactive{background:#2a3942; color:#8696a0;}
input, select, textarea{width:100%; background:#2a3942; border:none; border-radius:8px; padding:12px; color:white; margin-top:8px; font-size:14px;}
.page{display:none;} #page-home{display:block;}
.header{background:#202c33; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0;}
.tabs{display:flex; background:#202c33;}.tabs button{flex:1; background:none; border:none; color:#8696a0; padding:12px 2px; font-size:11px; font-weight:700;}.tabs button.active{color:#00a884; border-bottom:2px solid #00a884;}
</style>
</head>
<body>

<div id="authPage">
<div class="authBox">
<h2 style="margin:0; text-align:center;">ONIKEUNIVERSE</h2>
<p style="text-align:center; color:#00a884; font-size:11px; margin:4px 0 16px;">✅ SUPABASE FIXED - REAL DB</p>
<div class="authTabs"><button id="tabLogin" class="active" onclick="switchAuth('login')">Login</button><button id="tabRegister" class="inactive" onclick="switchAuth('register')">Register</button></div>

<div id="loginForm">
<input id="loginUser" placeholder="Username or Email" value="Admin">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="doLogin()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:10px; font-weight:700;">Login</button>
<p id="loginMsg" style="text-align:center; font-size:12px; color:#f15c6d; min-height:18px;"></p>
</div>

<div id="registerForm" style="display:none;">
<input id="regFullname" placeholder="Full Name *">
<input id="regUsername" placeholder="Username *">
<input id="regEmail" placeholder="Email *">
<input id="regPass" type="password" placeholder="Password *">
<div style="display:flex; gap:6px;"><select id="regGender" style="flex:1;"><option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select><select id="regCountry" style="flex:1;"><option>Uganda</option><option>USA</option><option>UK</option><option>Nigeria</option><option>Kenya</option></select></div>
<input id="regDob" type="date">
<textarea id="regBio" rows="2" placeholder="Bio"></textarea>
<button onclick="doRegister()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:10px; font-weight:700;">Create Account</button>
<p id="regMsg" style="text-align:center; font-size:12px; min-height:18px;"></p>
</div>
</div>
</div>

<div id="mainApp" style="display:none;">
<div class="header"><b>ONIKEUNIVERSE</b><span id="headerUser"></span></div>
<div class="tabs"><button class="active">🏠 HOME - Logged In</button></div>
<div style="padding:20px; text-align:center;">
<h3 id="welcomeName"></h3>
<p style="color:#8696a0; font-size:12px;">✅ Login success! Supabase connected.<br>Your data is real now, not localStorage demo.</p>
<button onclick="logout()" style="background:#f15c6d; color:white; border:none; padding:10px 20px; border-radius:8px;">Logout</button>
</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = "https://hhwltujbsqsniensmurq.supabase.co";
const SUPABASE_KEY = "sb_publishable_FqL6vMCT0ChrAV6pamuWlA_PgVxvWJM";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = supabase; // for debug

console.log("Supabase client created:",!!supabase);

window.switchAuth = function(t){
  document.getElementById('loginForm').style.display=t==='login'?'block':'none';
  document.getElementById('registerForm').style.display=t==='register'?'block':'none';
  document.getElementById('tabLogin').className=t==='login'?'active':'inactive';
  document.getElementById('tabRegister').className=t==='register'?'active':'inactive';
}

window.doRegister = async function(){
  let fn=document.getElementById('regFullname').value.trim();
  let un=document.getElementById('regUsername').value.trim();
  let em=document.getElementById('regEmail').value.trim();
  let ps=document.getElementById('regPass').value;
  let gd=document.getElementById('regGender').value;
  let ct=document.getElementById('regCountry').value;
  let msg=document.getElementById('regMsg');

  if(!fn||!un||!em||!ps||!gd){ msg.style.color='#f15c6d'; msg.innerText='Fill all * fields'; return; }

  msg.style.color='#00a884'; msg.innerText='Creating account in Supabase...';

  try{
    // Check if exists
    let { data: existing } = await supabase.from('users').select('username').or(`username.eq.${un},email.eq.${em}`).limit(1);
    if(existing && existing.length>0){ msg.style.color='#f15c6d'; msg.innerText='Username or email already exists'; return; }

    let { data, error } = await supabase.from('users').insert([{
      username: un,
      email: em,
      password: ps,
      fullname: fn,
      gender: gd,
      country: ct,
      bio: document.getElementById('regBio').value||'Explorer',
      pic: `https://i.pravatar.cc/150?u=${un}`,
      verified: false,
      is_admin: un.toLowerCase()==='roma' || un.toLowerCase()==='admin',
      is_king: un.toLowerCase()==='roma'
    }]).select();

    if(error) throw error;

    msg.style.color='#00a884'; msg.innerText='✅ Created! Logging in...';
    loginUser(data[0]);
  }catch(e){
    console.error(e);
    msg.style.color='#f15c6d'; msg.innerText='Error: '+e.message;
    // If table doesn't exist
    if(e.message.includes('relation') || e.message.includes('does not exist')){
      msg.innerText='Supabase tables not created! Run SQL from previous message.';
    }
  }
}

window.doLogin = async function(){
  let lu=document.getElementById('loginUser').value.trim();
  let lp=document.getElementById('loginPass').value;
  let msg=document.getElementById('loginMsg');

  if(!lu||!lp){ msg.innerText='Enter username and password'; return; }

  msg.style.color='#00a884'; msg.innerText='Checking Supabase...';

  try{
    let { data, error } = await supabase.from('users').select('*').or(`username.eq.${lu},email.eq.${lu}`).eq('password', lp).limit(1);

    if(error) throw error;
    if(!data || data.length===0){ msg.style.color='#f15c6d'; msg.innerText='Wrong username/email or password'; return; }

    if(data[0].is_banned){ msg.style.color='#f15c6d'; msg.innerText='🔨 Banned: '+(data[0].ban_reason||'Violates rules'); return; }

    loginUser(data[0]);
  }catch(e){
    console.error(e);
    msg.style.color='#f15c6d'; msg.innerText='Error: '+e.message;
  }
}

function loginUser(user){
  localStorage.setItem('currentUser', JSON.stringify(user));
  document.getElementById('authPage').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('headerUser').innerText=user.username + (user.is_king?' 👑 KING':'') + (user.verified?' ✓':'');
  document.getElementById('welcomeName').innerText='Welcome '+user.fullname+' ('+user.username+')';
}

window.logout = function(){ localStorage.removeItem('currentUser'); location.reload(); }

// Auto login if saved
let saved=localStorage.getItem('currentUser');
if(saved){
  try{ loginUser(JSON.parse(saved)); }catch(e){}
}
</script>
</body>
  </html>
