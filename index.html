<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnikeUniverse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#050510;color:#fff}
#water{position:fixed;inset:0;z-index:-1}
header{position:sticky;top:0;z-index:10;background:rgba(5,5,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(167,139,250,0.2);padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.logo{color:#a78bfa;font-weight:900;font-size:20px}.logo span{color:#00ff88;font-size:14px}
nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%;max-width:720px}
nav button{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:10px 4px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600}
nav button.active{background:#a78bfa;color:#000}
.page{display:none;max-width:720px;margin:auto;padding:12px}.page.active{display:block}
.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(16px);border:1px solid rgba(167,139,250,0.2);border-radius:16px;padding:12px;margin:10px 0}
.btn{background:#a78bfa;color:#000;border:0;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}
.online-dot{width:11px;height:11px;background:#00ff88;border-radius:50%;display:inline-block;border:2px solid #050510;box-shadow:0 0 6px #00ff88}
.avatar-wrap{position:relative;display:inline-block}.avatar-wrap span{position:absolute;bottom:0;right:0}
.post-img{width:100%;border-radius:12px;margin-top:8px;max-height:380px;object-fit:cover}
#preview{display:none;width:100%;border-radius:12px;margin-top:8px;max-height:250px;object-fit:cover}
textarea,input{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;color:#fff;margin-top:6px}
</style>
</head>
<body>
<canvas id="water"></canvas>
<header>
<div class="logo">OnikeUniverse <span id="onlineCount">• connecting...</span></div>
<nav>
<button onclick="show('home')" id="b-home" class="active">🏠 Home</button>
<button onclick="show('blog')" id="b-blog">📝 Blog</button>
<button onclick="show('pages')" id="b-pages">📄 Pages</button>
<button onclick="show('messages')" id="b-messages">💬 Messages</button>
<button onclick="show('friends')" id="b-friends">👥 Friends</button>
<button onclick="show('notifs')" id="b-notifs">🔔 Notifs</button>
<button onclick="show('profile')" id="b-profile">👤 Profile</button>
<button onclick="show('menu')" id="b-menu">☰ Menu</button>
<button onclick="show('settings')" id="b-settings">⚙️ Settings</button>
</nav>
</header>

<div id="home" class="page active">
<div class="card">
<div style="display:flex;gap:8px;align-items:center"><div class="avatar-wrap"><img src="https://i.pravatar.cc/100?img=33" style="width:40px;height:40px;border-radius:50%"><span class="online-dot"></span></div><b id="myNameHome">Supreme</b> <small style="color:#00ff88">● Online</small></div>
<textarea id="newPost" placeholder="What's happening? Write blog + add from Gallery..."></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button class="btn" style="background:rgba(167,139,250,0.2);color:#a78bfa;border:1px solid #a78bfa" onclick="document.getElementById('photoInput').click()">🖼️ Gallery</button>
<button class="btn" onclick="addPost()">🚀 Post Now</button>
</div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<img id="preview">
<div id="galleryPreview" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"></div>
</div>
<div id="feed"></div>
</div>

<div id="friends" class="page"><div class="card"><b>Friends - Real Time Online</b><br><small>Green dot = Online now</small></div><div id="friendsList">Connecting...</div></div>
<div id="blog" class="page"><div class="card"><h3>📝 Blog Feed</h3></div><div id="blogFeed"></div></div>
<div id="pages" class="page"><div class="card">📄 Official Pages</div></div>
<div id="messages" class="page"><div class="card">💬 Messages</div><div id="chat"></div></div>
<div id="notifs" class="page"><div id="notifList"></div></div>
<div id="profile" class="page">
<div class="card" style="text-align:center">
<div style="position:relative;width:180px;height:180px;margin:0 auto 12px">
<img src="https://i.pravatar.cc/100?img=33" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;border:3px solid #a78bfa;z-index:3">
<img src="https://i.pravatar.cc/100?img=12" style="position:absolute;left:50%;top:0;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;border:2px solid #fff">
<img src="https://i.pravatar.cc/100?img=15" style="position:absolute;right:0;top:22%;width:50px;height:50px;border-radius:50%;border:2px solid #fff">
<img src="https://i.pravatar.cc/100?img=8" style="position:absolute;right:0;bottom:22%;width:50px;height:50px;border-radius:50%;border:2px solid #fff">
<img src="https://i.pravatar.cc/100?img=20" style="position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;border:2px solid #fff">
<img src="https://i.pravatar.cc/100?img=26" style="position:absolute;left:0;bottom:22%;width:50px;height:50px;border-radius:50%;border:2px solid #fff">
<img src="https://i.pravatar.cc/100?img=31" style="position:absolute;left:0;top:22%;width:50px;height:50px;border-radius:50%;border:2px solid #fff">
<span class="online-dot" style="position:absolute;left:50%;top:50%;transform:translate(22px,18px);z-index:4;width:14px;height:14px"></span>
</div>
<h2 id="myNameDisplay">Supreme</h2><p style="color:#00ff88">● Online now - Kampala</p>
<input id="myNameInput" placeholder="Change display name"><button class="btn" onclick="saveName()">Save Name</button>
</div>
</div>
<div id="menu" class="page"><div class="card">☰ Menu</div></div>
<div id="settings" class="page"><div class="card"><h3>Settings</h3><button class="btn" onclick="localStorage.clear();location.reload()">Clear Local</button></div></div>
