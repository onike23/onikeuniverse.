<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnikeUniverse Platform</title>
    <!-- Google Fonts for crisp modern typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep-space: #07050f;
            --card-bg: rgba(22, 20, 38, 0.65);
            --text-primary: #ffffff;
            --text-secondary: #908da7;
            --accent-purple: #c084fc;
            --accent-blue: #38bdf8;
            --online-green: #22c55e;
            --nav-inactive: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0d0b18;
            /* Recreating the cosmic background mesh */
            background-image: 
                radial-gradient(at 20% 20%, rgba(147, 51, 234, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(8, 7, 16, 1) 0px, #07050f 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Mockup Grid Container */
        .workspace {
            display: flex;
            gap: 50px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Phone frame simulation */
        .phone-container {
            width: 380px;
            height: 760px;
            background: var(--bg-deep-space);
            border: 12px solid #1e1b30;
            border-radius: 48px;
            position: relative;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 40px rgba(168, 85, 247, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Notch / Dynamic Island Simulator */
        .phone-notch {
            width: 120px;
            height: 25px;
            background: #1e1b30;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Scrollable screen content area */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 35px 24px 90px 24px;
            scrollbar-width: none; /* Hide scrollbar for clean UI look */
        }
        .screen-content::-webkit-scrollbar {
            display: none;
        }

        /* Typography & Header styling exactly matching image */
        .brand-header {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-header::before {
            content: '✦';
            font-size: 18px;
            color: var(--accent-purple);
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.6);
        }

        .view-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .blog-title-color {
            color: #b07af0;
        }

        .messages-title-color {
            color: #b07af0;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .status-dot-inline {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--online-green);
            border-radius: 50%;
            margin-right: 4px;
        }

        /* --- BLOG VIEW COMPONENTS --- */
        .blog-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease;
        }

        .blog-card:hover {
            transform: translateY(-2px);
        }

        .post-heading {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            color: var(--accent-blue);
        }

        .post-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .post-meta span {
            color: var(--accent-purple);
        }

        .post-preview-img {
            width: 100%;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
            background: #131124;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background-size: cover;
            background-position: center;
        }

        /* --- MESSAGES VIEW COMPONENTS --- */
        .chat-row {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            position: relative;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .avatar-container {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2640;
        }

        .online-indicator {
            width: 12px;
            height: 12px;
            background-color: var(--online-green);
            border: 2px solid #0d0b18;
            border-radius: 50%;
            position: absolute;
            bottom: 1px;
            right: 1px;
        }

        .chat-details {
            flex: 1;
            min-width: 0;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-primary);
        }

        .message-snippet {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timestamp {
            font-size: 11px;
            color: var(--text-secondary);
            position: absolute;
            right: 16px;
            bottom: 16px;
            font-weight: 500;
        }

        /* --- BOTTOM NAVIGATION BAR --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background: rgba(10, 8, 22, 0.92);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px 10px 10px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: var(--nav-inactive);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            width: 60px;
            transition: color 0.2s ease;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Interactive Active Tab Styles matching design states */
        .nav-item.active-blog {
            color: var(--accent-blue);
        }
        .nav-item.active-messages {
            color: var(--accent-purple);
        }

        /* Quick View Toggle for responsively testing screens natively */
        @media (max-width: 800px) {
            .workspace {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="workspace">

    <!-- LEFT PHONE: BLOGS VIEW -->
    <div class="phone-container">
        <div class="phone-notch"></div>
        <div class="screen-content">
            <div class="brand-header">OnikeUniverse</div>
            <h1 class="view-title blog-title-color">Blog Posts</h1>
            <div style="height: 15px;"></div>

            <!-- Card 1 -->
            <div class="blog-card">
                <h2 class="post-heading">Exploring the Andromeda Nebula:<br>A Deep Dive</h2>
                <div class="post-meta">by <span>astro_writer</span> • 2h ago • 128 likes  24 comments</div>
                <!-- CSS Simulated high resolution dark cosmic image space -->
                <div class="post-preview-img" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url('https://unsplash.com');"></div>
            </div>

            <!-- Card 2 -->
            <div class="blog-card">
