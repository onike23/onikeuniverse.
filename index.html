<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONIKEUNIVERSE TEST</title>
<style>body{margin:0;background:#111b21;color:white;font-family:sans-serif;} button{padding:10px; margin:5px; cursor:pointer;} .page{display:none;} #page-home{display:block;} .header{background:#202c33;padding:10px;display:flex;justify-content:space-between;}</style>
</head>
<body>
<div class="header">
<b>ONIKEUNIVERSE</b>
<span onclick="openMenu()" style="cursor:pointer;">☰ MENU</span>
</div>
<div style="display:flex; background:#202c33;">
<button onclick="showPage('home')">HOME</button>
<button onclick="showPage('friends')">FRIENDS</button>
<button onclick="showPage('chats')">CHATS</button>
<button onclick="showPage('profile')">PROFILE</button>
</div>

<div id="page-home" class="page"><h2>🏠 HOME PAGE WORKS!</h2><button onclick="alert('Home button works!')">Test Home Button</button><div id="home-feed"></div></div>
<div id="page-friends" class="page"><h2>👥 FRIENDS WORKS!</h2><button onclick="alert('Add works!')">Add Friend</button></div>
<div id="page-chats" class="page"><h2>💬 CHATS WORKS!</h2></div>
<div id="page-profile" class="page"><h2>👤 PROFILE WORKS!</h2></div>

<script>
function showPage(n){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById('page-'+n).style.display='block'; console.log('Show page', n); }
function openMenu(){ alert('Menu button works! ☰'); }
document.getElementById('home-feed').innerHTML = '<p>✅ If you see this, JS is working</p><button onclick="likeTest()">Like ❤️ <span id="like-count">0</span></button>';
let likes=0;
function likeTest(){ likes++; document.getElementById('like-count').innerText=likes; alert('Like works! '+likes); }
</script>
</body>
  </html>
