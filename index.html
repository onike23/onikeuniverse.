<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONIKEUNIVERSE - Supabase Real</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;} body{margin:0; background:#111b21; color:#e9edef; font-family:sans-serif;}
.page{display:none;} #page-home{display:block;}
.header{background:#202c33; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;}
.tabs{display:flex; background:#202c33;}.tabs button{flex:1; background:none; border:none; color:#8696a0; padding:12px 2px; font-size:11px; font-weight:700; cursor:pointer;}.tabs button.active{color:#00a884; border-bottom:2px solid #00a884;}
#authPage{position:fixed; inset:0; background:#111b21; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.authBox{background:#202c33; width:100%; max-width:360px; border-radius:16px; padding:20px;}
.authTabs{display:flex; gap:10px; margin-bottom:16px;}.authTabs button{flex:1; padding:10px; border-radius:20px; border:none; font-weight:700; cursor:pointer;}
.authTabs button.active{background:#00a884; color:white;}.authTabs button.inactive{background:#2a3942; color:#8696a0;}
input, select, textarea{width:100%; background:#2a3942; border:none; border-radius:8px; padding:10px; color:white; margin-top:6px; font-size:13px;}
.post{background:#202c33; margin:8px; border-radius:12px; overflow:hidden;}
.post-head{display:flex; gap:10px; padding:10px; align-items:center;}
.post-head img{width:42px; height:42px; border-radius:50%; object-fit:cover;}
.post-img{width:100%; max-height:400px; object-fit:cover;}
.row{display:flex; gap:10px; padding:10px 14px; border-bottom:0.5px solid #2a3942; align-items:center;}
.row img{width:50px; height:50px; border-radius:50%; object-fit:cover;}
#menu{position:fixed; top:0; right:0; width:80%; max-width:300px; height:100%; background:#202c33; z-index:50; transform:translateX(100%); transition:0.3s;}
#menu.open{transform:translateX(0);} #overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40; display:none;}
.verified{width:16px; height:16px; background:#1d9bf0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:white; margin-left:4px;}
.subTabs{display:flex; gap:6px; padding:8px; background:#202c33;}
.subTabs button{flex:1; padding:8px; border-radius:20px; border:none; font-size:11px; font-weight:700; cursor:pointer; background:#2a3942; color:#8696a0;}
.subTabs button.active{background:#00a884; color:white;}
</style>
</head>
<body>

<div id="authPage">
<div class="authBox">
<h2 style="margin:0; text-align:center;">ONIKEUNIVERSE</h2>
<p style="text-align:center; color:#00a884; font-size:11px; margin:4px 0 16px;">✅ SUPABASE REAL DB - NO DEMO</p>
<div class="authTabs"><button id="tabLogin" class="active" onclick="switchAuth('login')">Login</button><button id="tabRegister" class="inactive" onclick="switchAuth('register')">Register</button></div>
<div id="loginForm"><input id="loginUser" placeholder="Username or Email"><input id="loginPass" type="password" placeholder="Password"><button onclick="doLogin()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:10px; font-weight:700;">Login</button><p id="loginMsg" style="text-align:center; font-size:11px; color:#f15c6d;"></p></div>
<div id="registerForm" style="display:none;"><input id="regFullname" placeholder="Full Name *"><input id="regUsername" placeholder="Username *"><input id="regEmail" placeholder="Email *"><input id="regPass" type="password" placeholder="Password *"><div style="display:flex; gap:6px;"><select id="regGender" style="flex:1;"><option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select><select id="regCountry" style="flex:1;"><option>Uganda</option><option>USA</option><option>UK</option><option>Nigeria</option><option>Kenya</option></select></div><input id="regDob" type="date"><textarea id="regBio" rows="2" placeholder="Bio"></textarea><button onclick="doRegister()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:10px; font-weight:700;">Create Account</button><p id="regMsg" style="text-align:center; font-size:11px;"></p></div>
</div>
</div>

<div id="mainApp" style="display:none;">
<div class="header"><b>ONIKEUNIVERSE</b><div style="display:flex; gap:10px; align-items:center;"><img id="headerPic" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover; border:2px solid #00a884;"><span onclick="openMenu()" style="font-size:22px; cursor:pointer;">☰</span></div></div>
<div class="tabs"><button onclick="showPage('home')" id="t-home" class="active">🏠 HOME</button><button onclick="showPage('friends')" id="t-friends">👥 FRIENDS</button><button onclick="showPage('profile')" id="t-profile">👤 PROFILE</button></div>
<div id="overlay" onclick="closeMenu()"></div>
<div id="menu"><div style="padding:16px; background:#111b21; display:flex; gap:10px; align-items:center;"><img id="menuPic" src="" style="width:48px; height:48px; border-radius:50%; object-fit:cover;"><div><div id="menuName" style="font-weight:700; font-size:13px;"></div><div id="menuSub" style="font-size:10px; color:#8696a0;"></div></div><span onclick="closeMenu()" style="margin-left:auto; cursor:pointer;">✕</span></div><div onclick="showPage('verification'); closeMenu();" style="padding:14px; border-bottom:0.5px solid #2a3942;">💎 Verification</div><div onclick="logout()" style="padding:14px; color:#f15c6d;">🚪 Logout</div></div>

<div id="page-home" class="page">
<div style="padding:8px;"><button onclick="toggleCreate()" style="width:100%; padding:10px; border-radius:20px; border:none; background:#202c33; color:#8696a0; text-align:left;">📝 What's on your mind? Create post...</button></div>
<div id="createBox" style="display:none; background:#202c33; margin:8px; padding:10px; border-radius:10px;">
<textarea id="postText" rows="3" placeholder="Write something real..."></textarea>
<input type="file" id="postFile" accept="image/*" style="display:none;">
<div id="postPreview" style="display:none; margin-top:8px; position:relative;"><img id="postPreviewImg" src="" style="width:100%; border-radius:10px; max-height:300px; object-fit:cover;"><span onclick="clearPostImage()" style="position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:white; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">✕</span></div>
<button onclick="document.getElementById('postFile').click()" style="width:100%; margin-top:8px; background:#2a3942; color:white; border:none; padding:10px; border-radius:8px; font-weight:700;">📷 Choose Photo from Gallery</button>
<button onclick="createPost()" id="postBtn" style="width:100%; margin-top:8px; background:#00a884; color:white; border:none; padding:12px; border-radius:8px; font-weight:700;">Post to Supabase</button>
<p id="postStatus" style="text-align:center; font-size:11px; color:#00a884;"></p>
</div>
<div id="homeFeed"></div>
</div>

<div id="page-friends" class="page">
<div style="padding:8px; background:#202c33;">
<input id="searchFriends" placeholder="🔍 Search by name..." oninput="renderFriends()" style="margin-top:0;">
<div style="display:flex; gap:6px; margin-top:8px;">
<select id="filterGender" onchange="renderFriends()" style="flex:1; margin-top:0; font-size:11px;"><option value="All">All Genders</option><option value="Male">👨 Male</option><option value="Female">👩 Female</option></select>
<select id="filterCountry" onchange="renderFriends()" style="flex:1; margin-top:0; font-size:11px;"><option value="All">All Countries</option><option value="Uganda">🇺🇬 Uganda</option><option value="USA">🇺🇸 USA</option><option value="UK">🇬🇧 UK</option><option value="Nigeria">🇳🇬 Nigeria</option><option value="Kenya">🇰🇪 Kenya</option></select>
<select id="filterAge" onchange="renderFriends()" style="flex:1; margin-top:0; font-size:11px;"><option value="All">All Ages</option><option value="18-24">18-24</option><option value="25-34">25-34</option><option value="35-50">35-50</option></select>
</div>
</div>
<div class="subTabs">
<button id="subAll" class="active" onclick="setFriendsTab('all')">🌍 All</button>
<button id="subAdd" onclick="setFriendsTab('add')">➕ Add</button>
<button id="subMy" onclick="setFriendsTab('my')">👥 My Friends</button>
<button id="subOnline" onclick="setFriendsTab('online')">🟢 Online</button>
</div>
<div id="friendsList"></div>
</div>

<div id="page-profile" class="page">
<div style="text-align:center; padding:20px; background:#202c33;">
<div style="position:relative; width:110px; height:110px; margin:0 auto;">
<img id="myPic" src="" onclick="document.getElementById('picInput').click()" style="width:110px; height:110px; border-radius:50%; border:3px solid #00a884; object-fit:cover; cursor:pointer;">
<div style="position:absolute; bottom:2px; right:2px; background:#00a884; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; border:2px solid #202c33; cursor:pointer;" onclick="document.getElementById('picInput').click()">📷</div>
</div>
<input type="file" id="picInput" accept="image/*" style="display:none;">
<h3 id="myNameBig" style="margin:8px 0 2px;"></h3>
<p id="myBioBig" style="font-size:12px; color:#8696a0;"></p>
<p id="myStatsBig" style="font-size:11px; color:#00a884;"></p>
</div>
<div style="padding:10px;"><input id="f_fullname"><input id="f_username" readonly style="color:#8696a0;"><textarea id="f_bio" rows="3"></textarea><button onclick="saveProfile()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:8px; font-weight:700;">💾 Save to Supabase</button><p id="saveMsg" style="text-align:center; color:#00a884; font-size:11px;"></p></div>
</div>
<div id="page-verification" class="page"><div style="padding:10px; background:#202c33;"><span onclick="showPage('home')" style="cursor:pointer;">← Back</span> <b>💎 Verification</b></div><div style="padding:12px;"><div id="verifStatusBox" style="background:#2a3942; padding:14px; border-radius:12px; text-align:center;"></div><div id="tasksList" style="margin-top:12px;"></div></div></div>
</div>

<script>
// SUPABASE INIT - YOUR KEYS
const SUPABASE_URL = "https://hhwltujbsqsniensmurq.supabase.co";
const SUPABASE_KEY = "sb_publishable_FqL6vMCT0ChrAV6pamuWlA_PgVxvWJM";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser=null; let friendsTab='all'; let selectedPostImage=''; let allRealUsers=[]; let allPosts=[]; let myFriends=[];

function switchAuth(t){ document.getElementById('loginForm').style.display=t==='login'?'block':'none'; document.getElementById('registerForm').style.display=t==='register'?'block':'none'; document.getElementById('tabLogin').className=t==='login'?'active':'inactive'; document.getElementById('tabRegister').className=t==='register'?'active':'inactive'; }

async function doRegister(){
  let fn=document.getElementById('regFullname').value.trim(); let un=document.getElementById('regUsername').value.trim(); let em=document.getElementById('regEmail').value.trim(); let ps=document.getElementById('regPass').value; let gd=document.getElementById('regGender').value; let ct=document.getElementById('regCountry').value; let dob=document.getElementById('regDob').value; let bio=document.getElementById('regBio').value.trim();
  let msg=document.getElementById('regMsg');
  if(!fn||!un||!em||!ps||!gd){ msg.style.color='#f15c6d'; msg.innerText='Fill all *'; return; }
  let age=25; if(dob){ age=new Date().getFullYear()-new Date(dob).getFullYear(); }
  msg.style.color='#00a884'; msg.innerText='Creating...';
  let { data, error } = await supabase.from('users').insert([{ username:un, email:em, password:ps, fullname:fn, gender:gd, country:ct, age:age, bio:bio||'Explorer', pic:`https://i.pravatar.cc/150?u=${un}`, verified:false }]).select();
  if(error){ msg.style.color='#f15c6d'; msg.innerText='Error: '+error.message; return; }
  msg.style.color='#00a884'; msg.innerText='✅ Created in Supabase! Logging in...';
  currentUser=data[0]; localStorage.setItem('currentUser', JSON.stringify(currentUser)); setTimeout(()=>loginUser(currentUser),800);
}

async function doLogin(){
  let lu=document.getElementById('loginUser').value.trim(); let lp=document.getElementById('loginPass').value; let msg=document.getElementById('loginMsg');
  msg.innerText='Checking Supabase...';
  let { data, error } = await supabase.from('users').select('*').or(`username.eq.${lu},email.eq.${lu}`).eq('password', lp).limit(1);
  if(error ||!data || data.length===0){ msg.innerText='Wrong username/email or password'; return; }
  loginUser(data[0]);
}

async function loginUser(user){
  currentUser=user; localStorage.setItem('currentUser', JSON.stringify(user));
  document.getElementById('authPage').style.display='none'; document.getElementById('mainApp').style.display='block';
  updatePics(); await loadAllData();
}

async function loadAllData(){
  // Load all real users from Supabase
  let { data: usersData } = await supabase.from('users').select('*');
  allRealUsers=usersData||[];
  // Load posts
  let { data: postsData } = await supabase.from('posts').select('*').order('created_at', {ascending:false});
  allPosts=postsData||[];
  // Load friends
  let { data: friendsData } = await supabase.from('friends').select('*').eq('owner_username', currentUser.username);
  myFriends=friendsData||[];
  renderHome(); renderFriends(); loadProfile(); renderVerification();
}

function updatePics(){ if(!currentUser) return; document.getElementById('headerPic').src=currentUser.pic; document.getElementById('menuPic').src=currentUser.pic; document.getElementById('myPic').src=currentUser.pic; document.getElementById('menuName').innerText=currentUser.fullname; document.getElementById('menuSub').innerText=currentUser.username; }

document.getElementById('picInput').addEventListener('change', async function(e){
  let file=e.target.files[0]; if(!file) return; let r=new FileReader(); r.onload=async function(ev){
    let base64=ev.target.result;
    let { error } = await supabase.from('users').update({ pic: base64 }).eq('username', currentUser.username);
    if(!error){ currentUser.pic=base64; localStorage.setItem('currentUser', JSON.stringify(currentUser)); updatePics(); await loadAllData(); alert('✅ Profile photo saved to Supabase!'); }
  }; r.readAsDataURL(file);
});

document.getElementById('postFile').addEventListener('change', function(e){
  let file=e.target.files[0]; if(!file) return; let r=new FileReader(); r.onload=function(ev){
    selectedPostImage=ev.target.result; document.getElementById('postPreviewImg').src=selectedPostImage; document.getElementById('postPreview').style.display='block';
  }; r.readAsDataURL(file);
});
function clearPostImage(){ selectedPostImage=''; document.getElementById('postFile').value=''; document.getElementById('postPreview').style.display='none'; }

function showPage(n){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById('page-'+n).style.display='block'; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); let tb=document.getElementById('t-'+n); if(tb) tb.classList.add('active'); }
function openMenu(){ document.getElementById('menu').classList.add('open'); document.getElementById('overlay').style.display='block'; }
function closeMenu(){ document.getElementById('menu').classList.remove('open'); document.getElementById('overlay').style.display='none'; }
function toggleCreate(){ let el=document.getElementById('createBox'); el.style.display=el.style.display==='none'?'block':'none'; }
function logout(){ localStorage.removeItem('currentUser'); location.reload(); }

async function createPost(){
  let text=document.getElementById('postText').value.trim(); if(!text){ alert('Write something'); return; }
  document.getElementById('postBtn').innerText='Posting to Supabase...'; document.getElementById('postBtn').disabled=true;
  let { data, error } = await supabase.from('posts').insert([{ user_username: currentUser.username, user_pic: currentUser.pic, text: text, img: selectedPostImage||'', likes:0 }]).select();
  if(error){ document.getElementById('postStatus').innerText='Error: '+error.message; } else {
    document.getElementById('postText').value=''; clearPostImage(); document.getElementById('createBox').style.display='none'; document.getElementById('postStatus').innerText='✅ Posted to Supabase!';
    await loadAllData();
  }
  document.getElementById('postBtn').innerText='Post to Supabase'; document.getElementById('postBtn').disabled=false;
}

function renderHome(){
  if(allPosts.length===0){
    document.getElementById('homeFeed').innerHTML=`<div style="text-align:center; padding:50px; color:#8696a0;">No posts yet in Supabase.<br>Create first real post!</div>`; return;
  }
  document.getElementById('homeFeed').innerHTML=allPosts.map(p=>`<div class="post"><div class="post-head"><img src="${p.user_pic}"><div style="flex:1;"><div style="font-size:13px; font-weight:700;">${p.user_username} ${p.user_username===currentUser.username?'<span class=verified>✓</span>':''}</div><div style="font-size:10px; color:#00a884;">Supabase Real • ${new Date(p.created_at).toLocaleString()}</div></div></div>${p.img?`<img class="post-img" src="${p.img}">`:''}<div style="padding:8px 12px; font-size:13px;">${p.text}</div></div>`).join('');
}

function setFriendsTab(tab){ friendsTab=tab; document.querySelectorAll('.subTabs button').forEach(b=>b.classList.remove('active')); document.getElementById('sub'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active'); renderFriends(); }

function renderFriends(){
  let search=(document.getElementById('searchFriends').value||'').toLowerCase();
  let gender=document.getElementById('filterGender').value;
  let country=document.getElementById('filterCountry').value;
  let ageRange=document.getElementById('filterAge').value;

  let filtered=allRealUsers.filter(u=>u.username!==currentUser.username).filter(u=>{
    if(search &&!u.username.toLowerCase().includes(search) &&!u.fullname.toLowerCase().includes(search)) return false;
    if(gender!=='All' && u.gender!==gender) return false;
    if(country!=='All' && u.country!==country) return false;
    if(ageRange!=='All'){ let [min,max]=ageRange.split('-').map(Number); if(u.age<min||u.age>max) return false; }
    return true;
  });

  let display=[];
  if(friendsTab==='all') display=filtered;
  if(friendsTab==='add') display=filtered.filter(u=>!myFriends.find(f=>f.friend_username===u.username));
  if(friendsTab==='my') display=filtered.filter(u=>myFriends.find(f=>f.friend_username===u.username));
  if(friendsTab==='online') display=filtered;

  if(allRealUsers.length<=1){
    document.getElementById('friendsList').innerHTML=`<div style="text-align:center; padding:40px; color:#8696a0;">No other real users yet in Supabase.<br>Share link to register: onike23.github.io</div>`; return;
  }

  document.getElementById('friendsList').innerHTML=display.map(u=>{
    let isFriend=!!myFriends.find(f=>f.friend_username===u.username);
    return `<div class="row"><img src="${u.pic}"><div style="flex:1;"><div style="font-size:13px; font-weight:600;">${u.username} ${u.verified?'<span class=verified>✓</span>':''}</div><div style="font-size:10px; color:#8696a0;">${u.gender} • ${u.age} yrs • ${u.country}</div><div style="font-size:10px; color:#00a884;">${u.bio||''}</div></div><div>${isFriend?'<span style="font-size:10px; color:#00a884;">✓ Friend</span>':`<button onclick="addFriend('${u.username}','${u.pic}')" style="background:#00a884; color:white; border:none; padding:6px 12px; border-radius:14px; font-size:11px;">Add</button>`}</div></div>`;
  }).join('');
}

async function addFriend(username, pic){
  let { error } = await supabase.from('friends').insert([{ owner_username: currentUser.username, friend_username: username, friend_pic: pic }]);
  if(!error){ await loadAllData(); }
}

function loadProfile(){ if(!currentUser) return; document.getElementById('myNameBig').innerText=currentUser.fullname; document.getElementById('myBioBig').innerText=currentUser.bio; document.getElementById('f_fullname').value=currentUser.fullname; document.getElementById('f_username').value=currentUser.username; document.getElementById('f_bio').value=currentUser.bio; }
async function saveProfile(){ let bio=document.getElementById('f_bio').value; let fullname=document.getElementById('f_fullname').value; let { error } = await supabase.from('users').update({ bio:bio, fullname:fullname }).eq('username', currentUser.username); if(!error){ currentUser.bio=bio; currentUser.fullname=fullname; localStorage.setItem('currentUser', JSON.stringify(currentUser)); document.getElementById('saveMsg').innerText='✅ Saved to Supabase!'; loadAllData(); } }

function renderVerification(){
  let likes=allPosts.filter(p=>p.user_username===currentUser.username).reduce((s,p)=>s+p.likes,0);
  document.getElementById('verifStatusBox').innerHTML=`Likes: ${likes}/100<br>Followers: ${myFriends.length}/50<br>Following: ${myFriends.length}/50`;
}

(function(){ let s=localStorage.getItem('currentUser'); if(s){ let u=JSON.parse(s); loginUser(u); } })();
</script>
</body>
  </html>
