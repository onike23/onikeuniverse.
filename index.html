<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnikeUniverse 🪐</title>
<style>
html,body{margin:0;padding:0;background:#070712 !important;color:#fff;min-height:100vh}
*{box-sizing:border-box;font-family:Inter,sans-serif}
.top-strip{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0a0a18;border-bottom:1px solid #1f1f3a;position:sticky;top:0;z-index:100}
.text-galaxy{background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.card{background:#11112a;border:1px solid #2a2a5a;border-radius:14px;padding:14px;margin:10px 16px}
.post-card{background:#11112a;border:1px solid #252545;border-radius:16px;padding:14px;margin:12px 16px}
.follow-btn{background:linear-gradient(90deg,#8b5cf6,#22d3ee);border:none;padding:6px 14px;border-radius:20px;color:#fff;font-size:12px;font-weight:600}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0a0a18;border-top:1px solid #1f1f3a;padding:8px 0;z-index:100}
.page{display:none;padding:10px 0 80px 0}.page.active{display:block}
input{background:#1a1a32;border:1px solid #2a2a5a;border-radius:12px;padding:10px 14px;color:#fff;width:100%}
.ou-official{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;background:#f59e0b;border-radius:50%;font-size:8px;margin-left:5px;border:1px solid #fbbf24}
</style>
</head>
<body>

<div class="top-strip">
  <b class="text-galaxy">🪐 OnikeUniverse</b>
  <div style="display:flex;gap:12px">
    <span onclick="showPage('blog')">🏠</span>
    <span onclick="showPage('friends')">🔍</span>
    <span onclick="showPage('menu')">☰</span>
  </div>
</div>

<div id="page-blog" class="page active">
  <div class="card"><input id="postInput" placeholder="What's happening?"><button class="follow-btn" style="margin-top:8px;width:100%" onclick="createPost()">Post 🪐</button></div>
  <div id="postsContainer"></div>
</div>

<div id="page-friends" class="page"><div class="card"><input id="searchInput" placeholder="Search..." oninput="searchUsers()"></div><div id="friendsList"></div></div>

<div id="page-profile" class="page"><div class="card" style="text-align:center"><img id="pAvatar" src="https://i.pravatar.cc/100" style="width:80px;border-radius:50%"><h3 id="pName" style="margin-top:8px"></h3><div style="display:flex;justify-content:space-around;margin-top:10px"><div><b id="statPosts">0</b><br><span style="font-size:11px">Posts</span></div><div><b id="statFollowers">0</b><br><span style="font-size:11px">Followers</span></div><div><b id="statFollowing">0</b><br><span style="font-size:11px">Following</span></div></div></div><div id="myPosts"></div></div>

<div id="page-menu" class="page">
  <div style="padding:20px;text-align:center;background:#11112a;margin:10px 16px;border-radius:18px"><img id="menuAvatar" src="https://i.pravatar.cc/100" style="width:80px;border-radius:50%"><h3 id="menuName"></h3><div id="verifyStatus" style="margin-top:6px"></div></div>
  <div class="card" onclick="showPage('profile')">👤 My Profile</div>
  <div class="card" onclick="requestVerify()" style="display:flex;justify-content:space-between"><span>🪐 Verify</span><span id="verifyBtnText">Locked</span></div>
  <div class="card" onclick="logout()">🚪 Logout</div>
</div>

<div class="bottom-nav">
  <div onclick="showPage('blog')">🏠<br>Home</div>
  <div onclick="showPage('friends')">🔍<br>Search</div>
  <div onclick="showPage('profile')">👤<br>Profile</div>
  <div onclick="showPage('menu')">☰<br>Menu</div>
</div>

<script>
let USER={name:'Supreme',avatar:'https://i.pravatar.cc/100'};
let POSTS=[{id:1,user:'Supreme',avatar:USER.avatar,content:'Welcome to OnikeUniverse 🪐',likes:5,time:Date.now()}];
let IS_VERIFIED=localStorage.getItem('onike_verified')==='true';
let FOLLOWED=new Set();
let FOLLOWERS=parseInt(localStorage.getItem('onike_followers')||'0');
