<!DOCTYPE html>
<html>
<head>
<title>ONIKEUNIVERSE - Fixed All Buttons</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;} body{margin:0; font-family:sans-serif; background:#111b21; color:#e9edef;}
.header{background:#202c33; position:sticky; top:0; z-index:20;}
.top{display:flex; justify-content:space-between; padding:10px 14px; align-items:center;}
.my-pic{width:30px; height:30px; border-radius:50%; border:2px solid #00a884; cursor:pointer;}
.tabs{display:flex;}.tabs button{flex:1; background:none; border:none; color:#8696a0; padding:12px 4px; cursor:pointer; font-size:11px; font-weight:700;}.tabs button.active{color:#00a884; border-bottom:2px solid #00a884;}
.page{display:none; min-height:80vh;} #page-home{display:block;}
.post{background:#202c33; margin:8px 0; border-radius:10px; overflow:hidden;}
.post-head{display:flex; gap:10px; padding:10px 12px; align-items:center;}
.post-head img{width:40px; height:40px; border-radius:50%;}
.post-info{flex:1;}
.post-name{font-size:13px; font-weight:700;}
.post-meta{font-size:10px; color:#8696a0;}
.post-img{width:100%; max-height:360px; object-fit:cover; background:#0b141a; cursor:pointer;}
.post-text{padding:8px 12px; font-size:13px;}
.post-actions{display:flex; gap:16px; padding:8px 12px; border-top:0.5px solid #2a3942; border-bottom:0.5px solid #2a3942;}
.post-actions span{font-size:12px; cursor:pointer; color:#8696a0; user-select:none;}
.post-actions span.liked{color:#00a884; font-weight:700;}
.trending-badge{background:#ff8c00; color:white; font-size:8px; padding:2px 6px; border-radius:10px;}
.row{display:flex; gap:10px; padding:10px 14px; border-bottom:0.5px solid #2a3942; align-items:center; cursor:pointer;}
.row img{width:46px; height:46px; border-radius:50%;}
.filter-bar{display:flex; gap:5px; padding:6px 10px; flex-wrap:wrap; background:#182533;}
.filter-bar button{border:none; padding:5px 10px; border-radius:14px; font-size:10px; background:#2a3942; color:white; cursor:pointer;}
.filter-bar button.active{background:#00a884;}
#menu-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:none;}
#menu-panel{position:fixed; top:0; right:0; width:80%; max-width:300px; height:100%; background:#202c33; z-index:60; transform:translateX(100%); transition:0.3s ease;}
#menu-panel.open{transform:translateX(0);}
.menu-item{padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:0.5px solid #2a3942; cursor:pointer; font-size:14px;}
.input-group{padding:8px 12px; background:#202c33; border-bottom:0.5px solid #2a3942;}
.input-group label{font-size:10px; color:#00a884; display:block; margin-bottom:3px;}
.input-group input,.input-group select,.input-group textarea{width:100%; background:#2a3942; border:none; border-radius:6px; padding:9px; color:white; font-size:12px;}
#chat-inside, #comment-modal{position:fixed; bottom:0; left:0; right:0; background:#111b21; z-index:100; display:none; flex-direction:column; border-radius:16px 16px 0 0;}
#chat-inside{height:72vh; background:#0b141a;} #comment-modal{height:75vh;}
.comment-box{display:flex; gap:6px; padding:8px 12px; background:#182533; align-items:center;}
</style>
</head>
<body>

<div class="header">
<div class="top">
<h1 style="margin:0; font-size:16px;">ONIKEUNIVERSE</h1>
<div style="display:flex; gap:12px; align-items:center;">
<img id="my-header-pic" class="my-pic" src="https://i.pravatar.cc/150?u=Kampala" onclick="showPage('profile')">
<span onclick="openMenu()" style="font-size:22px; cursor:pointer; user-select:none;">☰</span>
</div>
</div>
<div class="tabs">
<button onclick="showPage('home')" id="tab-home" class="active">🏠 HOME</button>
<button onclick="showPage('friends')" id="tab-friends">👥 FRIENDS</button>
<button onclick="showPage('chats')" id="tab-chats">💬 CHATS</button>
<button onclick="showPage('profile')" id="tab-profile">👤 PROFILE</button>
</div>
</div>

<div id="menu-overlay" onclick="closeMenu()"></div>
<div id="menu-panel">
<div style="padding:16px; background:#111b21; display:flex; align-items:center; gap:10px;">
<img id="menu-pic" src="https://i.pravatar.cc/150?u=Kampala" style="width:46px; height:46px; border-radius:50%; border:2px solid #00a884;">
<div><div id="menu-name" style="font-size:13px; font-weight:700;">Kampala Explorer</div><div id="menu-details" style="font-size:10px; color:#00a884;">25 yrs • Male</div></div>
<span onclick="closeMenu()" style="margin-left:auto; cursor:pointer; font-size:18px;">✕</span>
</div>
<div class="menu-item" onclick="goMenu('requests')">📥 Requests <span id="menu-req-count" style="margin-left:auto; background:#00a884; font-size:10px; padding:2px 7px; border-radius:10px;">1</span></div>
<div class="menu-item" onclick="goMenu('setting')">⚙️ Setting</div>
<div class="menu-item" onclick="goMenu('report')">⚠️ Report to Admin</div>
<div class="menu-item" style="margin-top:20px; color:#f15c6d;" onclick="logout()">🚪 Logout</div>
</div>

<!-- HOME -->
<div id="page-home" class="page">
<div style="display:flex; gap:6px; padding:8px 10px; background:#182533;">
<button onclick="setHomeFilter('recent')" id="hf-recent" style="flex:1; background:#00a884; color:white; border:none; padding:7px; border-radius:18px; font-size:11px; font-weight:700;">🕒 Recent</button>
<button onclick="setHomeFilter('trending')" id="hf-trending" style="flex:1; background:#2a3942; color:white; border:none; padding:7px; border-radius:18px; font-size:11px;">🔥 Trending</button>
<button onclick="setHomeFilter('following')" id="hf-following" style="flex:1; background:#2a3942; color:white; border:none; padding:7px; border-radius:18px; font-size:11px;">👥 Following</button>
</div>
<div style="padding:8px 12px;"><button onclick="toggleCreate()" style="width:100%; background:#202c33; color:#8696a0; border:none; padding:10px; border-radius:20px; text-align:left; font-size:12px; cursor:pointer;">📝 What's on your mind? Create post...</button></div>
<div id="create-post" style="display:none; background:#202c33; padding:10px; margin:8px; border-radius:10px;">
<textarea id="new-post-text" rows="3" placeholder="Write blog..." style="width:100%; background:#2a3942; border:none; border-radius:8px; padding:8px; color:white; font-size:12px;"></textarea>
<input id="new-post-img" placeholder="Image URL optional" style="width:100%; background:#2a3942; border:none; border-radius:6px; padding:7px; color:white; font-size:11px; margin-top:6px;">
<button onclick="createPost()" style="width:100%; background:#00a884; color:white; border:none; padding:8px; border-radius:8px; margin-top:8px; font-weight:700; cursor:pointer;">Post to Home</button>
</div>
<div id="home-feed"></div>
</div>

<!-- FRIENDS -->
<div id="page-friends" class="page">
<div style="background:#182533; padding:6px 10px; font-size:10px; color:#00a884;">MY: <b id="total-f">0</b> • ONLINE: <b id="online-f">0</b></div>
<div style="padding:6px 10px;"><input id="friend-search" placeholder="🔍 Search" oninput="renderFriends()" style="width:100%; background:#202c33; border:none; border-radius:8px; padding:8px 12px; color:white; font-size:12px;"></div>
<div class="filter-bar">
<button id="g-All" class="active" onclick="setFilter('gender','All')">🌍 All</button>
<button id="g-Male" onclick="setFilter('gender','Male')">👨 Male</button>
<button id="g-Female" onclick="setFilter('gender','Female')">👩 Female</button>
<button id="c-All" class="active" onclick="setFilter('country','All')">All Countries</button>
<button id="c-Uganda" onclick="setFilter('country','Uganda')">🇺🇬 UG</button>
<button id="c-USA" onclick="setFilter('country','USA')">🇺🇸 USA</button>
</div>
<div style="background:#202c33; padding:5px 12px; font-size:10px; color:#00a884;">➕ ADD FRIENDS — <span id="add-count">0</span></div>
<div id="add-friends-list"></div>
<div style="background:#202c33; padding:5px 12px; font-size:10px; color:#00a884; margin-top:6px;">👥 MY FRIENDS</div>
<div id="my-friends-list"></div>
</div>

<div id="page-chats" class="page"><div id="chats-list"></div></div>

<div id="page-profile" class="page">
<div style="text-align:center; padding:16px 0 8px; background:#202c33;">
<img id="my-profile-pic" src="https://i.pravatar.cc/150?u=Kampala" style="width:100px; height:100px; border-radius:50%; border:3px solid #00a884; cursor:pointer;" onclick="document.getElementById('pic-input').click()">
<input type="file" id="pic-input" accept="image/*" style="display:none;">
<h3 style="margin:6px 0 2px; font-size:15px;"><span id="my-name-display">Kampala Explorer</span> <span id="my-age-badge" style="background:#00a884; font-size:10px; padding:2px 6px; border-radius:10px;">25 yrs</span></h3>
<p id="my-details-display" style="font-size:10px; color:#00a884;"></p>
<p id="my-bio-display" style="font-size:11px; padding:0 20px;"></p>
</div>
<div style="display:flex;"><div class="input-group" style="flex:1;"><label>FULL NAME</label><input id="fullname-input"></div><div class="input-group" style="flex:1;"><label>USERNAME</label><input id="username-input"></div></div>
<div style="display:flex;"><div class="input-group" style="flex:1;"><label>GENDER</label><select id="gender-input"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="input-group" style="flex:1;"><label>DOB</label><input id="dob-input" type="date"></div><div class="input-group" style="flex:1;"><label>Age</label><input id="age-input" readonly></div></div>
<div style="display:flex;"><div class="input-group" style="flex:1;"><label>RELATIONSHIP</label><select id="rel-input"><option value="Single">Single</option><option value="Married">Married</option><option value="In Love">In Love</option><option value="Never">Never</option><option value="Complicated">Complicated</option><option value="Engaged">Engaged</option></select></div><div class="input-group" style="flex:1;"><label>COUNTRY</label><select id="country-input"><option value="Uganda">Uganda</option><option value="USA">USA</option><option value="UK">UK</option><option value="Nigeria">Nigeria</option><option value="Kenya">Kenya</option><option value="Canada">Canada</option></select></div></div>
<div class="input-group"><label>BIO</label><textarea id="bio-input" rows="2"></textarea></div>
<button onclick="saveProfile()" style="width:90%; margin:10px 5%; background:#00a884; color:white; border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer;">💾 Save Profile</button>
<p id="save-status" style="text-align:center; color:#00a884; font-size:11px;"></p>
</div>

<div id="page-requests" class="page"><div style="padding:10px; background:#202c33; display:flex; gap:10px; align-items:center;"><span onclick="showPage('home')" style="cursor:pointer; font-size:20px;">←</span><b>Requests</b></div><div id="incoming-list"></div><div id="sent-list" style="margin-top:10px; border-top:1px solid #2a3942;"></div></div>
<div id="page-setting" class="page"><div style="padding:10px; background:#202c33; display:flex; gap:10px; align-items:center;"><span onclick="showPage('profile')" style="cursor:pointer; font-size:20px;">←</span><b>Setting</b></div><div class="menu-item">🔔 Notifications: ON</div><div class="menu-item">🌙 Dark Mode: ON</div><div class="menu-item">🔒 Privacy</div><div class="menu-item" onclick="clearChats()" style="color:#f15c6d;">🗑️ Clear All Chats</div></div>
<div id="page-report" class="page"><div style="padding:10px; background:#202c33; display:flex; gap:10px; align-items:center;"><span onclick="showPage('home')" style="cursor:pointer; font-size:20px;">←</span><b>Report to Admin</b></div><div class="input-group"><label>Report Message</label><textarea id="report-text" rows="4" placeholder="What to report..."></textarea></div><button onclick="sendReport()" style="width:90%; margin:10px 5%; background:#f15c6d; border:none; padding:10px; border-radius:8px; color:white; font-weight:700; cursor:pointer;">⚠️ Send Report</button><p id="report-status" style="text-align:center; color:#00a884; font-size:11px;"></p><div id="reports-list" style="padding:10px;"></div></div>

<div id="chat-inside"><div style="background:#202c33; padding:8px; display:flex; gap:8px; align-items:center;"><span onclick="closeChat()" style="cursor:pointer; font-size:20px;">←</span><img id="chat-pic" src="" style="width:32px; height:32px; border-radius:50%;"><div style="flex:1;"><div id="chat-name" style="font-size:13px; font-weight:700;"></div><div id="chat-status" style="font-size:9px; color:#00a884;"></div></div></div><div id="chat-body" style="flex:1; overflow-y:auto; padding:10px;"></div><div style="display:flex; gap:6px; padding:8px; background:#202c33;"><input id="chat-input" style="flex:1; background:#2a3942; border:none; border-radius:20px; padding:9px 12px; color:white; font-size:13px;" placeholder="Type message..."><button onclick="sendMsg()" style="background:#00a884; border:none; width:36px; height:36px; border-radius:50%; color:white; cursor:pointer;">➤</button></div></div>

<div id="comment-modal"><div style="background:#202c33; padding:12px; display:flex; justify-content:space-between; align-items:center;"><b id="comment-modal-title" style="font-size:13px;">Comments</b><span onclick="closeComments()" style="cursor:pointer; font-size:18px;">✕</span></div><div id="comment-modal-body" style="flex:1; overflow-y:auto; padding:10px;"></div><div style="display:flex; gap:6px; padding:8px; background:#202c33;"><input id="modal-comment-input" style="flex:1; background:#2a3942; border:none; border-radius:20px; padding:9px 12px; color:white; font-size:12px;" placeholder="Add comment..."><button onclick="sendModalComment()" style="background:#00a884; border:none; width:36px; height:36px; border-radius:50%; color:white; cursor:pointer;">➤</button></div></div>

<script>
// DATA
const allUsers = [
  {name:"Stella_Kampala", pic:"https://i.pravatar.cc/150?img=5", online:true, gender:"Female", age:22, country:"Uganda", rel:"Single"},
  {name:"Gerardo_OG", pic:"https://i.pravatar.cc/150?img=12", online:true, gender:"Male", age:28, country:"USA", rel:"Married"},
  {name:"Alex_Morgan", pic:"https://i.pravatar.cc/150?img=8", online:false, gender:"Male", age:24, country:"UK", rel:"In Love"},
  {name:"Nova_Explorer", pic:"https://i.pravatar.cc/150?img=9", online:true, gender:"Female", age:21, country:"Canada", rel:"Never"},
  {name:"Sarah_Kampala", pic:"https://i.pravatar.cc/150?img=16", online:true, gender:"Female", age:23, country:"Uganda", rel:"Single"},
  {name:"Samuel_Galaxy", pic:"https://i.pravatar.cc/150?img=15", online:true, gender:"Male", age:26, country:"Kenya", rel:"Single"},
  {name:"Grace_Nebula", pic:"https://i.pravatar.cc/150?img=26", online:false, gender:"Female", age:25, country:"Nigeria", rel:"Engaged"},
  {name:"Moses_Star", pic:"https://i.pravatar.cc/150?img=53", online:true, gender:"Male", age:29, country:"Uganda", rel:"Married"},
];
let friends = JSON.parse(localStorage.getItem('onike_friends')||'null') || [{name:"Gerardo_OG", pic:"https://i.pravatar.cc/150?img=12", online:true}];
let sent = JSON.parse(localStorage.getItem('onike_sent')||'[]');
let requests = JSON.parse(localStorage.getItem('onike_requests')||'null') || [{name:"Stella_Kampala", pic:"https://i.pravatar.cc/150?img=5", gender:"Female", age:22, country:"Uganda"}];
let myPic = localStorage.getItem('onike_my_pic') || "https://i.pravatar.cc/150?u=Kampala";
let myFullName = localStorage.getItem('onike_fullname') || "Kampala Explorer";
let myName = localStorage.getItem('onike_my_name') || "Kampala Explorer";
let myDob = localStorage.getItem('onike_dob') || "2000-01-01";
let myRel = localStorage.getItem('onike_rel') || "Single";
let myGender = localStorage.getItem('onike_gender') || "Male";
let myCountry = localStorage.getItem('onike_country') || "Uganda";
let myBio = localStorage.getItem('onike_bio') || "Explorer 🌌 from Kampala";
let chats = JSON.parse(localStorage.getItem('onike_chats')||'{}');
let posts = JSON.parse(localStorage.getItem('onike_posts')||'null') || [
  {id:1, user:"Stella_Kampala", pic:"https://i.pravatar.cc/150?img=5", online:true, age:22, gender:"Female", country:"Uganda", time:"2h ago", text:"Exploring the stars from Kampala hills! 🌌✨ Milky Way so clear tonight.", img:"https://picsum.photos/600/400?random=1", likes:124, liked:false, followers:45, following:false, comments:[{user:"Alex_Morgan", text:"So beautiful! Count me in 🌟"}, {user:"Gerardo_OG", text:"Wow Stella 🔥🔥"}, {user:"Moses_Star", text:"Let's go tonight!"}, {user:"Nova_Explorer", text:"Amazing view 😍"}]},
  {id:2, user:"Gerardo_OG", pic:"https://i.pravatar.cc/150?img=12", online:true, age:28, gender:"Male", country:"USA", time:"5h ago", text:"Just launched ONIKEUNIVERSE v2.0 🚀 New filters + Home feed!", img:"https://picsum.photos/600/400?random=2", likes:89, liked:false, followers:120, following:false, comments:[{user:"Stella_Kampala", text:"Love it! ❤️"}, {user:"Samuel_Galaxy", text:"Great job bro 👏"}]},
  {id:3, user:"Sarah_Kampala", pic:"https://i.pravatar.cc/150?img=16", online:true, age:23, gender:"Female", country:"Uganda", time:"1h ago", text:"My new blog: 10 places to visit in Uganda 🇺🇬 From Bwindi to Jinja!", img:"https://picsum.photos/600/400?random=3", likes:210, liked:false, followers:67, following:false, comments:[{user:"Grace_Nebula", text:"Need this guide!"}, {user:"Moses_Star", text:"Jinja is best 😍"}, {user:"John_Ug", text:"Thanks"}, {user:"Aisha_Cosmos", text:"Saved! 🙏"}]},
  {id:4, user:"Samuel_Galaxy", pic:"https://i.pravatar.cc/150?img=15", online:true, age:26, gender:"Male", country:"Kenya", time:"30m ago", text:"Nairobi sunset from rooftop 🌅 No edit.", img:"https://picsum.photos/600/400?random=4", likes:56, liked:false, followers:33, following:true, comments:[{user:"Nova_Explorer", text:"Stunning! 😍"}]},
];
let homeFilter='recent'; let currentCommentPost=null; let currentChat=null; let filters={gender:'All', country:'All'};

function calcAge(d){ if(!d) return 25; const b=new Date(d), t=new Date(); let a=t.getFullYear()-b.getFullYear(); const m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate())) a--; return a; }
function flag(c){ return c==='Uganda'?'🇺🇬':c==='USA'?'🇺🇸':c==='UK'?'🇬🇧':c==='Nigeria'?'🇳🇬':c==='Kenya'?'🇰🇪':c==='Canada'?'🇨🇦':'🌍'; }
function gIcon(g){ return g==='Male'?'👨':g==='Female'?'👩':'⚧️'; }

function openMenu(){ document.getElementById('menu-overlay').style.display='block'; document.getElementById('menu-panel').classList.add('open'); }
function closeMenu(){ document.getElementById('menu-overlay').style.display='none'; document.getElementById('menu-panel').classList.remove('open'); }
function goMenu(p){ closeMenu(); showPage(p); }

function showPage(n){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  const pg=document.getElementById('page-'+n);
  if(pg) pg.style.display='block';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  const tb=document.getElementById('tab-'+n);
  if(tb) tb.classList.add('active');
  if(n==='home') renderHome();
  if(n==='friends') renderFriends();
  if(n==='chats') renderChats();
  if(n==='profile') loadProfile();
  if(n==='requests') renderRequests();
  if(n==='report') renderReports();
}

function setHomeFilter(f){
  homeFilter=f;
  document.getElementById('hf-recent').style.background=f==='recent'?'#00a884':'#2a3942';
  document.getElementById('hf-trending').style.background=f==='trending'?'#00a884':'#2a3942';
  document.getElementById('hf-following').style.background=f==='following'?'#00a884':'#2a3942';
  renderHome();
}
function toggleCreate(){ const el=document.getElementById('create-post'); el.style.display=el.style.display==='none'?'block':'none'; }

function renderHome(){
  let sorted=[...posts];
  if(homeFilter==='trending') sorted.sort((a,b)=>b.likes-a.likes);
  if(homeFilter==='recent') sorted.sort((a,b)=>b.id-a.id);
  if(homeFilter==='following') sorted=sorted.filter(p=>p.following);
  document.getElementById('home-feed').innerHTML = sorted.map(p=>{
    const two=p.comments.slice(-2);
    const trending=p.likes>100;
    return `<div class="post">
      <div class="post-head">
        <div style="position:relative;"><img src="${p.pic}"><span style="position:absolute; bottom:0; right:0; width:10px; height:10px; border-radius:50%; background:${p.online?'#00a884':'#8696a0'}; border:2px solid #202c33;"></span></div>
        <div class="post-info"><div class="post-name">${p.user} ${gIcon(p.gender)} ${flag(p.country)} ${trending?'<span class=trending-badge>🔥 TRENDING</span>':''}</div><div class="post-meta">${p.online?'🟢 online':'⚪ offline'} • ${p.age} yrs • ${p.time} • ${p.country}</div></div>
        <button onclick="toggleFollow(${p.id})" style="background:${p.following?'#2a3942':'#00a884'}; color:${p.following?'#8696a0':'white'}; border:none; padding:4px 10px; border-radius:14px; font-size:10px; cursor:pointer;">${p.following?'✓ Following':'＋ Follow'}</button>
      </div>
      ${p.img?`<img class="post-img" src="${p.img}" onclick="openChat('${p.user}','${p.pic}')">`:''}
      <div class="post-text">${p.text}</div>
      <div class="post-actions">
        <span class="${p.liked?'liked':''}" onclick="likePost(${p.id})">❤️ ${p.likes} likes</span>
        <span onclick="openComments(${p.id})">💬 ${p.comments.length} comments</span>
        <span onclick="openChat('${p.user}','${p.pic}')">✉️ Message</span>
        <span style="margin-left:auto;">👁️ ${p.followers}</span>
      </div>
      <div style="padding:8px 12px;">
        ${two.map(c=>`<div style="font-size:12px; padding:2px 0;"><b style="font-size:11px;">${c.user}</b> ${c.text}</div>`).join('')}
        ${p.comments.length>2?`<div style="font-size:11px; color:#00a884; cursor:pointer; padding:4px 0;" onclick="openComments(${p.id})">View all ${p.comments.length} comments → Tap to view all</div>`:''}
        ${p.comments.length===0?'<div style="font-size:11px; color:#8696a0;">No comments yet. Be first!</div>':''}
      </div>
      <div class="comment-box">
        <img src="${myPic}" style="width:28px; height:28px; border-radius:50%;">
        <input id="comment-input-${p.id}" placeholder="Add a comment..." onkeydown="if(event.key==='Enter') addComment(${p.id})" style="flex:1; background:#2a3942; border:none; border-radius:20px; padding:7px 12px; color:white; font-size:12px;">
        <button onclick="addComment(${p.id})" style="background:#00a884; border:none; width:28px; height:28px; border-radius:50%; color:white; cursor:pointer;">➤</button>
      </div>
    </div>`;
  }).join('');
}

function toggleFollow(id){ const p=posts.find(x=>x.id===id); if(!p) return; p.following=!p.following; p.following? p.followers++ : p.followers--; localStorage.setItem('onike_posts', JSON.stringify(posts)); renderHome(); }
function addComment(id){ const inp=document.getElementById('comment-input-'+id); if(!inp) return; const t=inp.value.trim(); if(!t) return; const p=posts.find(x=>x.id===id); p.comments.push({user:myFullName, text:t}); inp.value=''; localStorage.setItem('onike_posts', JSON.stringify(posts)); renderHome(); }

function closeComments(){ document.getElementById('comment-modal').style.display='none'; currentCommentPost=null; }
