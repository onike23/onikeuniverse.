<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONIKEUNIVERSE - Friends Filter</title>
<style>
*{box-sizing:border-box;} body{margin:0; background:#111b21; color:#e9edef; font-family:sans-serif;}
.page{display:none;} #page-home{display:block;}
.header{background:#202c33; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;}
.tabs{display:flex; background:#202c33;}.tabs button{flex:1; background:none; border:none; color:#8696a0; padding:12px 2px; font-size:11px; font-weight:700; cursor:pointer;}.tabs button.active{color:#00a884; border-bottom:2px solid #00a884;}
#authPage{position:fixed; inset:0; background:#111b21; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.authBox{background:#202c33; width:100%; max-width:360px; border-radius:16px; padding:20px;}
.authTabs{display:flex; gap:10px; margin-bottom:16px;}.authTabs button{flex:1; padding:10px; border-radius:20px; border:none; font-weight:700; cursor:pointer;}
.authTabs button.active{background:#00a884; color:white;}.authTabs button.inactive{background:#2a3942; color:#8696a0;}
input, select, textarea{width:100%; background:#2a3942; border:none; border-radius:8px; padding:10px; color:white; margin-top:6px; font-size:13px;}
.post{background:#202c33; margin:8px; border-radius:12px; overflow:hidden;}
.post-head{display:flex; gap:10px; padding:10px; align-items:center;}
.post-head img{width:42px; height:42px; border-radius:50%; object-fit:cover;}
.post-img{width:100%; max-height:400px; object-fit:cover;}
.row{display:flex; gap:10px; padding:10px 14px; border-bottom:0.5px solid #2a3942; align-items:center;}
.row img{width:50px; height:50px; border-radius:50%; object-fit:cover;}
#menu{position:fixed; top:0; right:0; width:80%; max-width:300px; height:100%; background:#202c33; z-index:50; transform:translateX(100%); transition:0.3s;}
#menu.open{transform:translateX(0);} #overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40; display:none;}
#chatBox{position:fixed; bottom:0; left:0; right:0; height:70vh; background:#0b141a; z-index:60; display:none; flex-direction:column; border-radius:16px 16px 0 0;}
.verified{width:16px; height:16px; background:#1d9bf0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:white; margin-left:4px;}
.filterBar{display:flex; gap:6px; padding:8px; overflow-x:auto; background:#182533; flex-wrap:nowrap;}
.filterBar button{white-space:nowrap; border:none; padding:7px 12px; border-radius:20px; font-size:11px; cursor:pointer; background:#2a3942; color:white;}
.filterBar button.active{background:#00a884;}
.subTabs{display:flex; gap:6px; padding:8px; background:#202c33;}
.subTabs button{flex:1; padding:8px; border-radius:20px; border:none; font-size:11px; font-weight:700; cursor:pointer; background:#2a3942; color:#8696a0;}
.subTabs button.active{background:#00a884; color:white;}
.onlineDot{width:10px; height:10px; background:#00a884; border-radius:50%; position:absolute; bottom:2px; right:2px; border:2px solid #202c33;}
</style>
</head>
<body>

<div id="authPage">
<div class="authBox">
<h2 style="margin:0; text-align:center;">ONIKEUNIVERSE</h2>
<p style="text-align:center; color:#8696a0; font-size:11px; margin:4px 0 16px;">Friends Filter Update</p>
<div class="authTabs"><button id="tabLogin" class="active" onclick="switchAuth('login')">Login</button><button id="tabRegister" class="inactive" onclick="switchAuth('register')">Register</button></div>
<div id="loginForm"><input id="loginUser" placeholder="Username or Email"><input id="loginPass" type="password" placeholder="Password"><button onclick="doLogin()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:10px; font-weight:700;">Login</button><p id="loginMsg" style="text-align:center; font-size:11px; color:#f15c6d;"></p></div>
<div id="registerForm" style="display:none;"><input id="regFullname" placeholder="Full Name *"><input id="regUsername" placeholder="Username *"><input id="regEmail" placeholder="Email *"><input id="regPass" type="password" placeholder="Password * min 6"><div style="display:flex; gap:6px;"><select id="regGender" style="flex:1;"><option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select><select id="regCountry" style="flex:1;"><option>Uganda</option><option>USA</option><option>UK</option><option>Nigeria</option><option>Kenya</option></select></div><input id="regDob" type="date"><textarea id="regBio" rows="2"></textarea><button onclick="doRegister()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:10px; font-weight:700;">Create Account</button><p id="regMsg" style="text-align:center; font-size:11px;"></p></div>
</div>
</div>

<div id="mainApp" style="display:none;">
<div class="header"><b>ONIKEUNIVERSE</b><div style="display:flex; gap:10px; align-items:center;"><img id="headerPic" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover; border:2px solid #00a884;"><span onclick="openMenu()" style="font-size:22px; cursor:pointer;">☰</span></div></div>
<div class="tabs"><button onclick="showPage('home')" id="t-home" class="active">🏠 HOME</button><button onclick="showPage('friends')" id="t-friends">👥 FRIENDS</button><button onclick="showPage('chats')" id="t-chats">💬 CHATS</button><button onclick="showPage('profile')" id="t-profile">👤 PROFILE</button></div>
<div id="overlay" onclick="closeMenu()"></div>
<div id="menu"><div style="padding:16px; background:#111b21; display:flex; gap:10px; align-items:center;"><img id="menuPic" src="" style="width:48px; height:48px; border-radius:50%; object-fit:cover;"><div><div id="menuName" style="font-weight:700; font-size:13px;"></div><div id="menuSub" style="font-size:10px; color:#8696a0;"></div></div><span onclick="closeMenu()" style="margin-left:auto; cursor:pointer;">✕</span></div><div onclick="showPage('requests'); closeMenu();" style="padding:14px; border-bottom:0.5px solid #2a3942; cursor:pointer;">📥 Requests <span id="reqBadge" style="float:right; background:#00a884; padding:2px 7px; border-radius:10px; font-size:10px;">0</span></div><div onclick="showPage('verification'); closeMenu();" style="padding:14px; border-bottom:0.5px solid #2a3942; cursor:pointer;">💎 Verification</div><div onclick="showPage('setting'); closeMenu();" style="padding:14px; border-bottom:0.5px solid #2a3942; cursor:pointer;">⚙️ Setting</div><div onclick="logout()" style="padding:14px; color:#f15c6d; cursor:pointer;">🚪 Logout</div></div>

<div id="page-home" class="page">
<div style="padding:8px;"><button onclick="toggleCreate()" style="width:100%; padding:10px; border-radius:20px; border:none; background:#202c33; color:#8696a0; text-align:left;">📝 What's on your mind? Create post...</button></div>
<div id="createBox" style="display:none; background:#202c33; margin:8px; padding:10px; border-radius:10px;">
<textarea id="postText" rows="3" placeholder="Write something..."></textarea>
<input type="file" id="postFile" accept="image/*" style="display:none;">
<div id="postPreview" style="display:none; margin-top:8px; position:relative;"><img id="postPreviewImg" src="" style="width:100%; border-radius:10px; max-height:300px; object-fit:cover;"><span onclick="clearPostImage()" style="position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:white; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">✕</span></div>
<button onclick="document.getElementById('postFile').click()" style="width:100%; margin-top:8px; background:#2a3942; color:white; border:none; padding:10px; border-radius:8px; font-weight:700;">📷 Choose from Gallery</button>
<button onclick="createPost()" style="width:100%; margin-top:8px; background:#00a884; color:white; border:none; padding:12px; border-radius:8px; font-weight:700;">Post</button>
<p id="postStatus" style="text-align:center; font-size:11px; color:#00a884;"></p>
</div>
<div id="homeFeed"></div>
</div>

<!-- FRIENDS PAGE WITH FULL FILTER -->
<div id="page-friends" class="page">
<div style="padding:8px; background:#202c33;">
<input id="searchFriends" placeholder="🔍 Search by name..." oninput="renderFriends()" style="margin-top:0;">
<div style="display:flex; gap:6px; margin-top:8px;">
<select id="filterGender" onchange="renderFriends()" style="flex:1; margin-top:0; font-size:11px;"><option value="All">All Genders</option><option value="Male">👨 Male</option><option value="Female">👩 Female</option><option value="Other">⚧️ Other</option></select>
<select id="filterCountry" onchange="renderFriends()" style="flex:1; margin-top:0; font-size:11px;"><option value="All">All Countries</option><option value="Uganda">🇺🇬 Uganda</option><option value="USA">🇺🇸 USA</option><option value="UK">🇬🇧 UK</option><option value="Nigeria">🇳🇬 Nigeria</option><option value="Kenya">🇰🇪 Kenya</option><option value="Canada">🇨🇦 Canada</option></select>
<select id="filterAge" onchange="renderFriends()" style="flex:1; margin-top:0; font-size:11px;"><option value="All">All Ages</option><option value="18-24">18-24</option><option value="25-34">25-34</option><option value="35-50">35-50</option></select>
</div>
</div>

<div class="subTabs">
<button id="subAll" class="active" onclick="setFriendsTab('all')">🌍 All</button>
<button id="subAdd" onclick="setFriendsTab('add')">➕ Add Friends</button>
<button id="subMy" onclick="setFriendsTab('my')">👥 My Friends</button>
<button id="subOnline" onclick="setFriendsTab('online')">🟢 Online</button>
</div>

<div style="padding:6px 12px; background:#182533; font-size:10px; color:#8696a0; display:flex; justify-content:space-between;">
<span id="friendsCount">0 users</span><span id="onlineCount">0 online</span>
</div>

<div id="friendsList"></div>
</div>

<div id="page-chats" class="page"><div id="chatsList"></div></div>
<div id="page-profile" class="page">
<div style="text-align:center; padding:20px; background:#202c33;">
<div style="position:relative; width:110px; height:110px; margin:0 auto;">
<img id="myPic" src="" onclick="document.getElementById('picInput').click()" style="width:110px; height:110px; border-radius:50%; border:3px solid #00a884; object-fit:cover; cursor:pointer;">
<div style="position:absolute; bottom:2px; right:2px; background:#00a884; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; border:2px solid #202c33; cursor:pointer;" onclick="document.getElementById('picInput').click()">📷</div>
</div>
<input type="file" id="picInput" accept="image/*" style="display:none;">
<h3 id="myNameBig" style="margin:8px 0 2px;"></h3>
<p id="myBioBig" style="font-size:12px; color:#8696a0;"></p>
<p id="myStatsBig" style="font-size:11px; color:#00a884;"></p>
<p id="picStatus" style="font-size:11px; color:#00a884;"></p>
</div>
<div style="padding:10px;"><input id="f_fullname"><input id="f_username" readonly style="color:#8696a0;"><textarea id="f_bio" rows="3"></textarea><select id="f_country"><option>Uganda</option><option>USA</option><option>UK</option><option>Nigeria</option><option>Kenya</option></select><button onclick="saveProfile()" style="width:100%; margin-top:12px; background:#00a884; color:white; border:none; padding:12px; border-radius:8px; font-weight:700;">💾 Save</button><p id="saveMsg" style="text-align:center; color:#00a884; font-size:11px;"></p></div>
</div>
<div id="page-requests" class="page"><div style="padding:10px; background:#202c33;"><span onclick="showPage('home')" style="cursor:pointer;">← Back</span> <b>Requests</b></div><div id="reqList"></div></div>
<div id="page-verification" class="page"><div style="padding:10px; background:#202c33;"><span onclick="showPage('home')" style="cursor:pointer;">← Back</span> <b>💎 Verification</b></div><div style="padding:12px;"><div id="verifStatusBox" style="background:#2a3942; padding:14px; border-radius:12px; text-align:center;"></div><div id="tasksList" style="margin-top:12px;"></div></div></div>
<div id="page-setting" class="page"><div style="padding:10px; background:#202c33;"><span onclick="showPage('home')" style="cursor:pointer;">← Back</span> <b>Setting</b></div><div style="padding:14px;" id="settingInfo"></div><button onclick="clearDemo()" style="width:90%; margin:10px 5%; background:#f15c6d; color:white; border:none; padding:10px; border-radius:8px;">🗑️ Remove Demo Posts</button></div>
<div id="chatBox"><div style="background:#202c33; padding:10px; display:flex; gap:8px; align-items:center;"><span onclick="closeChat()" style="cursor:pointer;">←</span><b id="chatName"></b></div><div id="chatBody" style="flex:1; overflow-y:auto; padding:10px;"></div><div style="display:flex; gap:6px; padding:8px; background:#202c33;"><input id="chatInput" placeholder="Type..." style="flex:1;"><button onclick="sendMsg()" style="background:#00a884; border:none; width:40px; border-radius:50%; color:white;">➤</button></div></div>
</div>

<script>
let currentUser=null;
let users=JSON.parse(localStorage.getItem('onike_users')||'[]');
let friends=JSON.parse(localStorage.getItem('friends')||'[]');
let requests=JSON.parse(localStorage.getItem('requests')||'[]');
let chats=JSON.parse(localStorage.getItem('chats')||'{}');
let posts=JSON.parse(localStorage.getItem('posts')||'null')||[];
let homeFilter='recent'; let currentChat=null; let selectedPostImage='';
let friendsTab='all'; // all, add, my, online

// REAL USERS DATABASE FOR DISCOVERY - with age, gender, country, online
let allUsers=[
{name:"Stella_Kampala", pic:"https://i.pravatar.cc/150?img=5", gender:"Female", age:22, country:"Uganda", online:true, verified:true},
{name:"Gerardo_OG", pic:"https://i.pravatar.cc/150?img=12", gender:"Male", age:28, country:"USA", online:true, verified:true},
{name:"Sarah_Kampala", pic:"https://i.pravatar.cc/150?img=16", gender:"Female", age:24, country:"Uganda", online:false, verified:true},
{name:"Alex_Morgan", pic:"https://i.pravatar.cc/150?img=8", gender:"Male", age:26, country:"UK", online:true, verified:false},
{name:"Moses_Star", pic:"https://i.pravatar.cc/150?img=53", gender:"Male", age:30, country:"Uganda", online:true, verified:false},
{name:"Grace_Nebula", pic:"https://i.pravatar.cc/150?img=26", gender:"Female", age:21, country:"Nigeria", online:true, verified:false},
{name:"John_Kenya", pic:"https://i.pravatar.cc/150?img=15", gender:"Male", age:32, country:"Kenya", online:false, verified:false},
{name:"Aisha_Canada", pic:"https://i.pravatar.cc/150?img=9", gender:"Female", age:23, country:"Canada", online:true, verified:false},
{name:"David_USA", pic:"https://i.pravatar.cc/150?img=33", gender:"Male", age:29, country:"USA", online:true, verified:false},
{name:"Nancy_Ug", pic:"https://i.pravatar.cc/150?img=32", gender:"Female", age:19, country:"Uganda", online:false, verified:false},
];

function switchAuth(t){ document.getElementById('loginForm').style.display=t==='login'?'block':'none'; document.getElementById('registerForm').style.display=t==='register'?'block':'none'; document.getElementById('tabLogin').className=t==='login'?'active':'inactive'; document.getElementById('tabRegister').className=t==='register'?'active':'inactive'; }
function doRegister(){ let fn=document.getElementById('regFullname').value.trim(); let un=document.getElementById('regUsername').value.trim(); let em=document.getElementById('regEmail').value.trim(); let ps=document.getElementById('regPass').value; let gd=document.getElementById('regGender').value; if(!fn||!un||!em||!ps||!gd){ document.getElementById('regMsg').innerText='Fill all *'; return; } let nu={fullname:fn, username:un, email:em, password:ps, gender:gd, country:document.getElementById('regCountry').value, bio:document.getElementById('regBio').value||'Explorer', pic:'https://i.pravatar.cc/150?u='+un, verified:false, followers:0, following:0, age:25, online:true}; users.push(nu); localStorage.setItem('onike_users', JSON.stringify(users)); loginUser(nu); }
function doLogin(){ let lu=document.getElementById('loginUser').value.trim(); let lp=document.getElementById('loginPass').value; let f=users.find(u=> (u.username.toLowerCase()===lu.toLowerCase() || u.email.toLowerCase()===lu.toLowerCase()) && u.password===lp); if(!f){ document.getElementById('loginMsg').innerText='Wrong'; return; } loginUser(f); }
function loginUser(user){ currentUser=user; localStorage.setItem('currentUser', JSON.stringify(user)); document.getElementById('authPage').style.display='none'; document.getElementById('mainApp').style.display='block'; updateAllPics(); loadProfile(); renderHome(); renderFriends(); }
function checkLogin(){ let s=localStorage.getItem('currentUser'); if(s){ let u=JSON.parse(s); let fresh=users.find(x=>x.username===u.username)||u; loginUser(fresh); } }
function logout(){ localStorage.removeItem('currentUser'); location.reload(); }
function updateAllPics(){ if(!currentUser) return; document.getElementById('headerPic').src=currentUser.pic; document.getElementById('menuPic').src=currentUser.pic; document.getElementById('myPic').src=currentUser.pic; document.getElementById('menuName').innerText=currentUser.fullname; document.getElementById('menuSub').innerText=currentUser.username; }

document.getElementById('picInput').addEventListener('change', function(e){
  let file=e.target.files[0]; if(!file) return; let r=new FileReader(); r.onload=function(ev){
    currentUser.pic=ev.target.result; users=users.map(u=>u.username===currentUser.username?currentUser:u);
    localStorage.setItem('onike_users', JSON.stringify(users)); localStorage.setItem('currentUser', JSON.stringify(currentUser));
    updateAllPics(); document.getElementById('picStatus').innerText='✅ Photo updated!';
  }; r.readAsDataURL(file);
});
document.getElementById('postFile').addEventListener('change', function(e){
  let file=e.target.files[0]; if(!file) return; let r=new FileReader(); r.onload=function(ev){
    selectedPostImage=ev.target.result; document.getElementById('postPreviewImg').src=selectedPostImage; document.getElementById('postPreview').style.display='block';
  }; r.readAsDataURL(file);
});
function clearPostImage(){ selectedPostImage=''; document.getElementById('postFile').value=''; document.getElementById('postPreview').style.display='none'; }

function showPage(n){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById('page-'+n).style.display='block'; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); let tb=document.getElementById('t-'+n); if(tb) tb.classList.add('active'); if(n==='home') renderHome(); if(n==='friends') renderFriends(); if(n==='profile') loadProfile(); }
function openMenu(){ document.getElementById('menu').classList.add('open'); document.getElementById('overlay').style.display='block'; }
function closeMenu(){ document.getElementById('menu').classList.remove('open'); document.getElementById('overlay').style.display='none'; }
function toggleCreate(){ let el=document.getElementById('createBox'); el.style.display=el.style.display==='none'?'block':'none'; }
function setHomeFilter(f){ homeFilter=f; document.getElementById('hf-recent').style.background=f==='recent'?'#00a884':'#2a3942'; document.getElementById('hf-trending').style.background=f==='trending'?'#00a884':'#2a3942'; document.getElementById('hf-following').style.background=f==='following'?'#00a884':'#2a3942'; renderHome(); }
function renderHome(){
  let list=[...posts]; if(homeFilter==='trending') list.sort((a,b)=>b.likes-a.likes); if(homeFilter==='recent') list.sort((a,b)=>b.id-a.id);
  if(list.length===0){ document.getElementById('homeFeed').innerHTML=`<div style="text-align:center; padding:40px; color:#8696a0;">No posts yet. Create first post!</div>`; return; }
  document.getElementById('homeFeed').innerHTML=list.map(p=>`<div class="post"><div class="post-head"><img src="${p.pic}"><div style="flex:1;"><div style="font-size:13px; font-weight:700;">${p.user}</div><div style="font-size:10px; color:#00a884;">${p.time}</div></div></div>${p.img?`<img class="post-img" src="${p.img}">`:''}<div style="padding:8px 12px; font-size:13px;">${p.text}</div></div>`).join('');
}
function createPost(){
  let text=document.getElementById('postText').value.trim(); if(!text){ alert('Write something'); return; }
  let np={id:Date.now(), user:currentUser.username, pic:currentUser.pic, verified:currentUser.verified, time:"now", text:text, img:selectedPostImage||'', likes:0, liked:false, comments:[]};
  posts.unshift(np); localStorage.setItem('posts', JSON.stringify(posts));
  document.getElementById('postText').value=''; clearPostImage(); document.getElementById('createBox').style.display='none'; renderHome();
}

// FRIENDS FILTER SYSTEM - NEW
function setFriendsTab(tab){
  friendsTab=tab;
  document.querySelectorAll('.subTabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('sub'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  renderFriends();
}

function renderFriends(){
  let search=(document.getElementById('searchFriends').value||'').toLowerCase();
  let gender=document.getElementById('filterGender').value;
  let country=document.getElementById('filterCountry').value;
  let ageRange=document.getElementById('filterAge').value;

  // Combine real users + registered users
  let combined=[...allUsers];
  users.forEach(u=>{
    if(u.username!==currentUser.username &&!combined.find(c=>c.name===u.username)){
      combined.push({name:u.username, pic:u.pic, gender:u.gender||'Other', age:u.age||25, country:u.country||'Uganda', online:u.online||false, verified:u.verified||false});
    }
  });

  // Filter by name, gender, country, age
  let filtered=combined.filter(u=>{
    if(search &&!u.name.toLowerCase().includes(search)) return false;
    if(gender!=='All' && u.gender!==gender) return false;
    if(country!=='All' && u.country!==country) return false;
    if(ageRange!=='All'){
      let [min,max]=ageRange.split('-').map(Number);
      if(u.age<min || u.age>max) return false;
    }
    return true;
  });

  // Tab logic
  let displayList=[];
  if(friendsTab==='all') displayList=filtered;
  if(friendsTab==='add') displayList=filtered.filter(u=>!friends.find(f=>f.name===u.name));
  if(friendsTab==='my') displayList=filtered.filter(u=>friends.find(f=>f.name===u.name));
  if(friendsTab==='online') displayList=filtered.filter(u=>u.online);

  // For my tab, if no filter, show all my friends regardless of search filter? Use friends list directly when no search
  if(friendsTab==='my' &&!search && gender==='All' && country==='All' && ageRange==='All'){
    displayList=friends.map(f=>{
      let full=combined.find(c=>c.name===f.name)||f;
      return full;
    });
  }
  if(friendsTab==='online' &&!search && gender==='All' && country==='All' && ageRange==='All'){
    displayList=friends.map(f=>combined.find(c=>c.name===f.name)||f).filter(u=>u && u.online);
    if(displayList.length===0) displayList=filtered.filter(u=>u.online); // fallback to all online if no friends online
  }

  document.getElementById('friendsCount').innerText=`${displayList.length} users`;
  document.getElementById('onlineCount').innerText=`${filtered.filter(u=>u.online).length} online`;
  document.getElementById('reqBadge').innerText=requests.length;

  if(displayList.length===0){
    document.getElementById('friendsList').innerHTML=`<div style="text-align:center; padding:30px; color:#8696a0; font-size:12px;">No users found<br><span style="font-size:10px;">Try change filters: Name, Gender, Age, Country</span><br><button onclick="document.getElementById('searchFriends').value=''; document.getElementById('filterGender').value='All'; document.getElementById('filterCountry').value='All'; document.getElementById('filterAge').value='All'; renderFriends();" style="margin-top:10px; background:#2a3942; color:white; border:none; padding:6px 12px; border-radius:14px; font-size:11px;">Reset Filters</button></div>`;
    return;
  }

  document.getElementById('friendsList').innerHTML=displayList.map(u=>{
    let isFriend=!!friends.find(f=>f.name===u.name);
    let isMe=u.name===currentUser.username;
    return `<div class="row" onclick="openChat('${u.name}','${u.pic}')">
      <div style="position:relative;"><img src="${u.pic}">${u.online?'<div class=onlineDot></div>':''}</div>
      <div style="flex:1;">
        <div style="font-size:13px; font-weight:600;">${u.name} ${u.verified?'<span class=verified>✓</span>':''}</div>
        <div style="font-size:10px; color:#8696a0;">${u.gender==='Male'?'👨':u.gender==='Female'?'👩':'⚧️'} ${u.gender} • ${u.age} yrs • ${u.country==='Uganda'?'🇺🇬':u.country==='USA'?'🇺🇸':u.country==='UK'?'🇬🇧':u.country==='Nigeria'?'🇳🇬':u.country==='Kenya'?'🇰🇪':'🌍'} ${u.country} • ${u.online?'🟢 online':'⚪ offline'}</div>
      </div>
      <div>
        ${isMe?'<span style="font-size:10px; color:#8696a0;">You</span>':isFriend?'<span style="font-size:10px; color:#00a884;">✓ Friend</span>':`<button onclick="event.stopPropagation(); addFriend('${u.name}')" style="background:#00a884; color:white; border:none; padding:6px 12px; border-radius:14px; font-size:11px; cursor:pointer;">Add</button>`}
      </div>
    </div>`;
  }).join('');
}

function addFriend(name){
  if(friends.find(f=>f.name===name)) return;
  let u=[...allUsers,...users.map(x=>({name:x.username, pic:x.pic}))].find(x=>x.name===name);
  let pic=u?u.pic:`https://i.pravatar.cc/150?u=${name}`;
  friends.push({name:name, pic:pic});
  localStorage.setItem('friends', JSON.stringify(friends));
  renderFriends();
}
function loadProfile(){ if(!currentUser) return; document.getElementById('myPic').src=currentUser.pic; document.getElementById('myNameBig').innerText=currentUser.fullname; document.getElementById('myBioBig').innerText=currentUser.bio; document.getElementById('f_fullname').value=currentUser.fullname; document.getElementById('f_username').value=currentUser.username; document.getElementById('f_bio').value=currentUser.bio; }
function saveProfile(){ currentUser.fullname=document.getElementById('f_fullname').value||currentUser.fullname; currentUser.bio=document.getElementById('f_bio').value||currentUser.bio; users=users.map(u=>u.username===currentUser.username?currentUser:u); localStorage.setItem('onike_users', JSON.stringify(users)); localStorage.setItem('currentUser', JSON.stringify(currentUser)); document.getElementById('saveMsg').innerText='✅ Saved!'; }
function clearDemo(){ posts=[]; localStorage.setItem('posts', JSON.stringify(posts)); renderHome(); alert('Demo cleared'); }

checkLogin();
</script>
